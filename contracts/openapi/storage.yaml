  "info": {
    "title": "Platform Storage API",
    "version": "1.0.0",
    "description": "Личное файловое пространство ученика: манифесты, версии, краткоживущие transfer tickets и синхронизация с агентом. Бинарные данные не хранятся в PostgreSQL."
