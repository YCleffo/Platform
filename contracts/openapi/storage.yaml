  "components": {
    "responses": {
      "Error": {
        "description": "Ошибка",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "status": {
                  "type": "string"
                },
                "error": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "meta": {
                      "type": "object",
                      "properties": {
                        "storageCode": {
                          "type": "string"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "StorageSpace": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "studentId": {
            "type": "string",
            "format": "uuid"
          },
          "maxFiles": {
            "type": "integer"
          },
          "maxBytes": {
            "type": "integer"
          },
          "fileCount": {
            "type": "integer"
          },
          "totalBytes": {
            "type": "integer"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "studentId",
          "maxFiles",
          "maxBytes",
          "fileCount",
          "totalBytes",
          "createdAt"
        ]
      },
      "StorageFile": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "path": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "nullable": true
          },
          "sizeBytes": {
            "type": "integer",
            "nullable": true
          },
          "sha256": {
            "type": "string",
            "nullable": true
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        },
        "required": [
          "id",
          "path"
        ]
      },
      "StorageFilePage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StorageFile"
            }
          },
          "limit": {
            "type": "integer",
            "enum": [
              50
            ]
          },
          "offset": {
            "type": "integer"
          },
          "nextOffset": {
            "type": "integer",
            "nullable": true
          }
        },
        "required": [
          "items",
          "limit",
          "offset",
          "nextOffset"
        ]
      },
      "TicketRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "purpose": {
            "type": "string",
            "enum": [
              "upload",
              "download"
            ]
          },
          "path": {
            "type": "string",
            "maxLength": 1024
          }
        },
        "required": [
          "purpose",
          "path"
        ]
      },
      "TransferTicket": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "spaceId": {
            "type": "string",
            "format": "uuid"
          },
          "purpose": {
            "type": "string",
            "enum": [
              "upload",
              "download"
            ]
          },
          "path": {
            "type": "string"
          },
          "token": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "spaceId",
          "purpose",
          "path",
          "token",
          "expiresAt"
        ]
      },
      "UploadResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "path": {
            "type": "string"
          },
          "version": {
            "type": "integer"
          },
          "sha256": {
            "type": "string"
          }
        },
        "required": [
          "path",
          "version",
          "sha256"
        ]
      },
      "ManifestEntry": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "path": {
            "type": "string"
          },
          "op": {
            "type": "string",
            "enum": [
              "add",
              "update",
              "delete"
            ]
          },
          "sha256": {
            "type": "string"
          },
          "size": {
            "type": "integer"
          },
          "version": {
            "type": "integer"
          }
        },
        "required": [
          "path",
          "op"
        ]
      },
      "ManifestRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "spaceId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "entries": {
            "type": "array",
            "items": {
