    "description": "Core authentication with a distinct parent scope. Family evidence and login identity are separate. Existing guardian relationships migrate to pending. Revocation is effective on next request. 72-hour one-time 256-bit invitations store only SHA-256 digests. All mutations audit and preserve educational history."
  },
