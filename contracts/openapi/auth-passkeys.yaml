openapi: 3.1.0
info:
  title: API WebAuthn и внешних учётных данных Platform Core
  version: 1.1.0
  description: >-
    Самообслуживание учётных данных Core. WebAuthn требует проверки пользователя, обнаруживаемых учётных данных и
    настроенных RP/источника. Внешняя привязка связана с исходными аккаунтом/сессией, state и PKCE. Обратный вызов SPA
    передаёт одноразовый код провайдера исходному авторизованному окну; токены Core не передаются всплывающему окну.
paths:
  /api/auth/passkeys/registration/start:
    post:
      operationId: startPasskeyRegistration
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Новые параметры регистрации, привязанные к сессии
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        $ref: "#/components/schemas/CreationOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RecentRequired"
  /api/auth/passkeys/registration/complete:
    post:
      operationId: completePasskeyRegistration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
                label:
                  type:
                    - string
                    - "null"
                  maxLength: 160
      responses:
        "201":
          description: Зарегистрированные учётные данные; закрытый ключ не отправляется серверу
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PasskeyCreated"
        "400":
          description: "auth.passkey.invalid: неверное, истёкшее или повторное подтверждение, UV, RP или источник"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RecentRequired"
        "409":
          description: "auth.passkey.conflict: учётные данные уже зарегистрированы"
        "413":
          description: Запрос превышает 32768 байт
        "422":
          description: Неверные учётные данные или метка
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Ограничитель безопасности недоступен; действие запрещено
  /api/auth/passkeys/authentication/start:
    post:
      operationId: startPasskeyAuthentication
      responses:
        "200":
          description: Вход с обнаруживаемыми данными без идентификатора аккаунта
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        $ref: "#/components/schemas/RequestOptions"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Ограничитель безопасности недоступен; действие запрещено
  /api/auth/passkeys/authentication/complete:
    post:
      operationId: completePasskeyAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: object
                  required:
                    - id
                    - rawId
                    - type
                    - response
      responses:
        "200":
          description: Продолжение аутентификации как при пароле или внешнем входе
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthenticationResult"
        "401":
          description: Неверное/истёкшее подтверждение, источник/RP/UV/идентификатор пользователя или отозванные учётные данные
        "413":
          description: Запрос превышает 32768 байт
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Ограничитель безопасности недоступен; действие запрещено
  /api/auth/me/passkeys:
    get:
      operationId: listOwnPasskeys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Только активные учётные данные текущего аккаунта
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        required:
                          - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/PasskeySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameOwnPasskey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label:
                  type:
                    - string
                    - "null"
                  maxLength: 160
      responses:
        "200":
          description: Оболочка успеха с PasskeySummary; null удаляет метку
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Учётные данные отсутствуют или принадлежат другому аккаунту
        "422":
          description: Неверная метка
    delete:
      operationId: revokeOwnPasskey
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ с data.status=revoked; история сохраняется
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RecentRequired"
        "404":
          description: Учётные данные отсутствуют или принадлежат другому аккаунту
        "409":
          $ref: "#/components/responses/LastMethod"
  /api/auth/providers:
    get:
      operationId: listEnabledExternalProviders
      responses:
        "200":
          description: >-
            Успешный ответ с data.items: code, displayName, loginEnabled. Включённый провайдер с loginEnabled=false
            может разрешать привязку.
  /api/auth/me/identities:
    get:
      operationId: listOwnExternalIdentities
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Безопасные привязанные записи; без внешнего субъекта, утверждений и токенов OAuth
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        required:
                          - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExternalIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/me/identities/{provider}/link/start:
    parameters:
      - $ref: "#/components/parameters/Provider"
    post:
      operationId: startOwnExternalIdentityLink
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ с data.authorizationUrl и data.expiresAt
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RecentRequired"
        "404":
          description: Провайдер недоступен
        "409":
          description: "auth.identity.conflict: провайдер уже привязан"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Ограничитель безопасности недоступен; действие запрещено
  /api/auth/me/identities/{provider}/link/callback:
    parameters:
      - $ref: "#/components/parameters/Provider"
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: completeOwnExternalIdentityLink
      description: Вызывается исходным аутентифицированным окном SPA после обратного вызова всплывающего окна провайдера.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ с ExternalIdentity
        "401":
          description: Неверная аутентификация, state, обратный вызов, PKCE или доказательство провайдера
        "403":
          $ref: "#/components/responses/RecentRequired"
        "409":
          description: "auth.identity.conflict: внешняя учётная запись уже принадлежит другому аккаунту"
        "503":
          description: Ограничитель безопасности недоступен; действие запрещено
  /api/auth/me/identities/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    delete:
      operationId: unlinkOwnExternalIdentity
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ с data.status=unlinked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RecentRequired"
        "404":
          description: auth.provider.not_linked
        "409":
          $ref: "#/components/responses/LastMethod"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
          - google
          - telegram
  schemas:
    Success:
      type: object
      required:
        - status
        - data
      properties:
        status:
          const: success
        data: {}
    CreationOptions:
      type: object
      required:
        - rp
        - user
        - challenge
        - pubKeyCredParams
        - timeout
        - authenticatorSelection
        - attestation
        - excludeCredentials
      properties:
        rp:
          type: object
          required:
            - id
            - name
        user:
          type: object
          required:
            - id
            - name
            - displayName
        challenge:
          type: string
          description: Байты в кодировке Base64url
        pubKeyCredParams:
          type: array
          items:
            type: object
            required:
              - type
              - alg
        timeout:
          type: integer
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              const: required
            requireResidentKey:
              const: true
            userVerification:
              const: required
        attestation:
          const: none
        excludeCredentials:
          type: array
          items:
            type: object
            required:
              - type
              - id
    RequestOptions:
      type: object
      required:
        - challenge
        - rpId
        - timeout
        - userVerification
        - allowCredentials
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
        userVerification:
          const: required
        allowCredentials:
          type: array
          maxItems: 0
    PasskeyCreated:
      type: object
      required:
        - id
        - label
        - createdAt
        - transports
        - backupEligible
        - backupState
      properties:
        id:
          type: string
          format: uuid
        label:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        transports:
          type: array
          items:
            type: string
        backupEligible:
          type: boolean
        backupState:
          type: boolean
    PasskeySummary:
      allOf:
        - $ref: "#/components/schemas/PasskeyCreated"
        - required:
            - lastUsedAt
    AuthenticationResult:
      oneOf:
        - type: object
          required:
            - status
            - accessToken
            - refreshToken
            - accessExpiresAt
            - sessionExpiresAt
            - sessionId
          properties:
            status:
              const: authenticated
            accessToken:
              type: string
            refreshToken:
              type: string
            accessExpiresAt:
              type: string
              format: date-time
            sessionExpiresAt:
              type: string
              format: date-time
            sessionId:
              type: string
              format: uuid
        - type: object
          required:
            - status
            - challengeToken
          properties:
            status:
              enum:
                - mfa_required
                - password_change_required
            challengeToken:
              type: string
            allowedFactors:
              type: array
              items:
                type: string
    ExternalIdentity:
      type: object
      required:
        - provider
        - email
        - emailVerified
        - displayName
        - avatarUrl
        - linkedAt
        - lastLoginAt
      properties:
        provider:
          type: string
          enum:
            - google
            - telegram
        email:
          type:
            - string
            - "null"
        emailVerified:
          type: boolean
        displayName:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
        linkedAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
  responses:
    Unauthorized:
      description: Требуется аутентификация
    RecentRequired:
      description: "auth.recent_required: явно войдите заново перед повтором"
    LastMethod:
      description: "auth.identity.last_method: сохраните хотя бы один действующий способ входа"
    RateLimited:
      description: "auth.rate_limited: не повторяйте процедуру аутентификатора автоматически"
