  "components": {
    "securitySchemes": {
      "CoreBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "Organization": {
        "in": "header",
        "name": "X-Education-Organization",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "Id": {
        "in": "path",
        "name": "id",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "responses": {
      "Error": {
        "description": "Authorization, tenant isolation, invalid lifecycle/version/idempotency, deadline or input error.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "File": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "mime": {
            "type": "string"
          },
          "sizeBytes": {
            "type": "integer",
            "minimum": 1
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "mime",
          "sizeBytes"
        ]
      },
      "ActivityConfig": {
        "type": "object",
        "properties": {
          "durationSeconds": {
            "type": "integer",
            "enum": [
              15,
              30,
              60
            ]
          },
          "language": {
            "type": "string",
            "enum": [
              "ru",
              "en"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "words",
              "sentences",
              "numbers",
              "code",
              "accuracy"
            ]
          },
          "difficulty": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3
          },
          "roundCount": {
            "type": "integer",
            "enum": [
              5,
              10
            ]
