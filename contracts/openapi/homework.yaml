{
  "openapi": "3.0.3",
  "info": {
    "title": "Platform Education Homework",
    "version": "1.0.0",
    "description": "Core Bearer identity and live Education organization/relationship access. No-store. Immutable answer revisions and transactional notifications/files. DRAFT > PUBLISHED > CLOSED > ARCHIVED. Draft edits survive deadline expiry; late submission requires allowLate. Published recipients are frozen and survive group removal. Client version conflicts use HTTP409 meta.homeworkCode=version_conflict; reused idempotency key with another payload uses idempotency_conflict. Only IN_PROGRESS/RETURNED answers are editable. Returned exercise work requires a fresh verified Activities attempt. Exercise metrics are never accepted in a Homework request."
  },
  "servers": [
    {
      "url": "/api/education"
    }
  ],
  "security": [
    {
      "CoreBearer": []
    }
  ],
