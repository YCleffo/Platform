        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.feature_flags.read.
    put:
      summary: Атомарно создать или заменить конфигурацию флага
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/Flag"
        "401":
