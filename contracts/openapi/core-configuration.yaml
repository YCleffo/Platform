        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.feature_flags.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagInput"
    delete:
      summary: Удалить конфигурацию флага
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: object
                    required:
                      - deleted
                      - code
                    properties:
                      deleted:
                        type: boolean
                        enum:
                          - true
                      code:
                        type: string
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.feature_flags.manage.
    parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          maxLength: 160
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Module:
      type: object
      required:
        - id
        - code
        - name
        - version
        - settingsSchemaVersion
        - enabled
        - installedAt
        - enabledAt
        - disabledAt
        - description
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
          nullable: true
        settingsSchemaVersion:
          type: integer
        enabled:
          type: boolean
        installedAt:
          type: string
          format: date-time
        enabledAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
    SystemSetting:
      type: object
      required:
        - id
        - key
        - value
        - description
        - createdAt
        - updatedAt
        - updatedByAccountId
        - isPublic
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          description: Значение JSON до 16384 байт; вложенные ключи, похожие на секреты, запрещены.
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedByAccountId:
          type: string
          format: uuid
          nullable: true
        isPublic:
          type: boolean
    ModuleSetting:
      type: object
      required:
        - id
        - key
        - value
        - description
        - createdAt
        - updatedAt
        - updatedByAccountId
        - moduleCode
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          description: Значение JSON до 16384 байт; вложенные ключи, похожие на секреты, запрещены.
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedByAccountId:
          type: string
          format: uuid
          nullable: true
        moduleCode:
          type: string
    SystemSettingInput:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value: {}
        description:
          type: string
          nullable: true
          maxLength: 1000
        isPublic:
          type: boolean
          default: false
    ModuleSettingInput:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value: {}
        description:
          type: string
          nullable: true
          maxLength: 1000
    FlagInput:
      type: object
      additionalProperties: false
      required:
        - enabled
        - rolloutPercent
        - config
      properties:
        moduleCode:
          type: string
          nullable: true
        enabled:
          type: boolean
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
        config:
          oneOf:
            - type: object
              additionalProperties: {}
            - type: array
              maxItems: 0
          description: >-
            Конфигурация-объект; пустой объект PHP может сериализовать как []. До 16384 байт; ключи, похожие на секреты,
            запрещены.
        description:
          type: string
          nullable: true
          maxLength: 1000
    Flag:
      type: object
      required:
        - id
        - code
        - moduleCode
        - enabled
        - rolloutPercent
        - config
        - description
        - createdAt
        - updatedAt
        - updatedByAccountId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        moduleCode:
          type: string
          nullable: true
        enabled:
          type: boolean
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
        config:
          oneOf:
            - type: object
              additionalProperties: {}
            - type: array
              maxItems: 0
          description: >-
            Конфигурация-объект; пустой объект PHP может сериализовать как []. До 16384 байт; ключи, похожие на секреты,
            запрещены.
        description:
          type: string
          nullable: true
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedByAccountId:
          type: string
          format: uuid
          nullable: true
