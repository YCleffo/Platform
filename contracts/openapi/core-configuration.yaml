openapi: 3.0.3
info:
  title: Конфигурация Platform Core
  version: 1.0.0
  description: >-
    Жизненный цикл модулей, системные/модульные настройки, флаги и анонимная публикация. Конфигурация не хранит секреты.
    Интерфейс не обещает вычислять фактическую доступность возможностей.
security:
  - bearerAuth: {}
paths:
  /api/public/config:
    get:
      summary: Предпросмотр текущих публичных системных значений без аутентификации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: object
                    required:
                      - settings
                    properties:
                      settings:
                        type: object
                        additionalProperties: {}
      security: {}
  /api/core/modules:
    get:
      summary: Список установленных модулей
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Module"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.modules.read.
  /api/core/modules/{code}:
    get:
      summary: Прочитать установленный модуль
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/Module"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.modules.read.
    parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
  /api/core/modules/{code}/enable:
    post:
      summary: Включить установленный модуль
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Module"
                      - type: object
                        required:
                          - changed
                        properties:
                          changed:
                            type: boolean
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.modules.manage.
    parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
  /api/core/modules/{code}/disable:
    post:
      summary: Выключить установленный модуль
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Module"
                      - type: object
                        required:
                          - changed
                        properties:
                          changed:
                            type: boolean
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.modules.manage.
    parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
  /api/core/settings/system:
    get:
      summary: Список записей конфигурации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SystemSetting"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.read.
  /api/core/settings/system/{key}:
    get:
      summary: Прочитать текущее значение ключа
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/SystemSetting"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.read.
    put:
      summary: Атомарно создать или заменить запись конфигурации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/SystemSetting"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingInput"
    delete:
      summary: Удалить запись конфигурации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: object
                    required:
                      - deleted
                      - key
                    properties:
                      deleted:
                        type: boolean
                        enum:
                          - true
                      key:
                        type: string
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.manage.
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
          maxLength: 160
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
  /api/core/modules/{moduleCode}/settings:
    get:
      summary: Список записей конфигурации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModuleSetting"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.read.
    parameters:
      - in: path
        name: moduleCode
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
  /api/core/modules/{moduleCode}/settings/{key}:
    get:
      summary: Прочитать текущее значение ключа
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/ModuleSetting"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.read.
    put:
      summary: Атомарно создать или заменить запись конфигурации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/ModuleSetting"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleSettingInput"
    delete:
      summary: Удалить запись конфигурации
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: object
                    required:
                      - deleted
                      - key
                    properties:
                      deleted:
                        type: boolean
                        enum:
                          - true
                      key:
                        type: string
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.settings.manage.
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
          maxLength: 160
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
      - in: path
        name: moduleCode
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
  /api/core/feature-flags:
    get:
      summary: Список конфигураций флагов возможностей
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Flag"
        "401":
          description: Требуется аутентификация
        "403":
          description: Доступ запрещён
        "404":
          description: Неизвестный модуль, ключ или флаг
        "422":
          description: Неверный ввод, похожий на секрет ключ или размер более 16384 байт JSON
      description: Нужно разрешение core.feature_flags.read.
  /api/core/feature-flags/{code}:
    get:
      summary: Прочитать конфигурацию флага
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  data:
                    $ref: "#/components/schemas/Flag"
        "401":
          description: Требуется аутентификация
        "403":
