openapi: 3.1.0
info:
  title: Platform User Settings / Privacy API
  version: 2.0.0
  description: Authenticated self-service contract for schema version 2 account settings, preferences and consents.

paths:
  /api/auth/me/settings:
    get:
      operationId: getOwnAccountSettings
      summary: Read effective settings for the current account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Versioned defaults merged with the account's sparse overrides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: patchOwnAccountSettings
      summary: Deep-merge settings for the current account
      description: >
        Accepts a non-empty partial document up to 32768 bytes. Omitted siblings are
        preserved. A null registered leaf removes its override and restores the
        versioned default. Account IDs and unregistered namespaces are rejected.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
            examples:
              privacy:
                value:
                  privacy:
                    show_online_status: false
              reset:
                value:
                  privacy:
                    show_online_status: null
      responses:
        '200':
          description: Effective settings after the atomic merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSuccess'
        '400':
          description: Malformed JSON.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload exceeds 32768 bytes.
        '422':
          description: Unknown path, invalid type, empty patch, or malformed nested object.

  /api/auth/me/preferences:
    patch:
      operationId: patchOwnInternationalPreferences
      summary: Save language and IANA time zone for the current account
      description: Omitted fields are preserved atomically; explicit null restores service defaults.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                locale: { type: [string, 'null'], examples: [ru-RU, en-US] }
                timezone: { type: [string, 'null'], examples: [UTC, Asia/Yekaterinburg] }
      responses:
        '200':
          description: Canonical preferences after the update
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { const: success }
                  data:
                    type: object
                    required: [locale, timezone]
                    properties:
                      locale: { type: [string, 'null'] }
                      timezone: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid or unsupported language/time zone }
  /api/auth/me/consents:
    get:
      operationId: getOwnConsents
      summary: Read published consent definitions and the latest record per code
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Definitions may be empty; an unavailable full text is null
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { const: success }
                  data:
                    type: object
                    required: [definitions, consents]
                    properties:
                      definitions: { type: array, items: { $ref: '#/components/schemas/ConsentDefinition' } }
                      consents: { type: array, items: { $ref: '#/components/schemas/ConsentRecord' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: The account has no human Person }
  /api/auth/me/consents/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: grantOwnConsent
      summary: Record consent to the registered document
      description: >
        Browser clients supply the reviewed version and hash. They cannot override server
        document metadata; mismatches or unavailable full text produce 409. Empty bodies
        remain supported for existing internal clients.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, maxProperties: 0 }
                - type: object
                  additionalProperties: false
                  required: [document_version, document_sha256]
                  properties:
                    document_version: { type: string, minLength: 1 }
                    document_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Existing matching or newly recorded current consent
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { const: success }
                  data: { $ref: '#/components/schemas/ConsentRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown consent code }
        '409': { description: Reviewed document changed or is unavailable }
        '422': { description: Invalid input or ineligible account }
    delete:
      operationId: withdrawOwnConsent
      summary: Withdraw the active consent when the definition permits it
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Consent withdrawn; the record remains in history }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No active consent }
        '422': { description: Withdrawal not permitted or ineligible account }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    SettingsSuccess:
      type: object
      required: [status, data]
      properties:
        status:
          const: success
        data:
          type: object
          required: [settings, schema_version]
          properties:
            settings:
              $ref: '#/components/schemas/EffectiveSettings'
            schema_version:
              type: integer
              const: 2
    EffectiveSettings:
      type: object
      additionalProperties: false
      required: [interface, notifications, privacy]
      properties:
        interface:
          $ref: '#/components/schemas/InterfaceSettings'
        notifications:
          $ref: '#/components/schemas/NotificationSettings'
        privacy:
          $ref: '#/components/schemas/PrivacySettings'
    SettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        interface:
          $ref: '#/components/schemas/InterfaceSettingsPatch'
        notifications:
          $ref: '#/components/schemas/NotificationSettingsPatch'
        privacy:
          $ref: '#/components/schemas/PrivacySettingsPatch'
    InterfaceSettings:
      type: object
      additionalProperties: false
      required: [animations, transparency]
      properties:
        animations: { type: boolean, default: true }
        transparency: { type: boolean, default: true }
    InterfaceSettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        animations: { type: [boolean, 'null'] }
        transparency: { type: [boolean, 'null'] }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [browser, sound, email]
      properties:
        browser: { type: boolean, default: true }
        sound: { type: boolean, default: true }
        email: { type: boolean, default: false }
    NotificationSettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        browser: { type: [boolean, 'null'] }
        sound: { type: [boolean, 'null'] }
        email: { type: [boolean, 'null'] }
    PrivacySettings:
      type: object
      additionalProperties: false
      required: [show_online_status]
      properties:
        show_online_status: { type: boolean, default: false }
    PrivacySettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        show_online_status: { type: [boolean, 'null'] }
    ConsentDefinition:
      type: object
      required: [code, purpose_code, current_document_version, current_document_sha256, withdrawable, representative_allowed, document]
      properties:
        code: { type: string }
        purpose_code: { type: string }
        current_document_version: { type: string }
        current_document_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        withdrawable: { type: boolean }
        representative_allowed: { type: boolean }
        document:
          type: [object, 'null']
          required: [title, text]
          properties:
            title: { type: string }
            text: { type: string, description: Plain text whose UTF-8 SHA-256 matches the registered document hash }
    ConsentRecord:
      type: object
      required: [id, consent_code, purpose_code, document_version, document_sha256, locale, source, granted_at, withdrawn_at, current]
      properties:
        id: { type: string, format: uuid }
        consent_code: { type: string }
        purpose_code: { type: string }
        document_version: { type: string }
        document_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        locale: { type: string }
        source: { type: string }
        granted_at: { type: string }
        withdrawn_at: { type: [string, 'null'] }
        current: { type: boolean }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked authentication session.
