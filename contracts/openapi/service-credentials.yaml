openapi: 3.1.0
info:
  title: Platform Service Credentials & Developer API
  version: 1.0.0
  description: Управление персональными API-токенами и сервисными ключами разработчика.
paths:
  /api/core/accounts/{accountId}/service-credentials:
    get:
      operationId: listServiceCredentials
      summary: Список выданных сервисных ключей аккаунта
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список метаданных ключей
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceCredential"
    post:
      operationId: createServiceCredential
      summary: Выпустить новый сервисный ключ
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  nullable: true
                scopes:
                  type: array
                  items:
                    type: string
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  nullable: true
      responses:
        "201":
          description: Ключ выпущен. Секрет возвращается только один раз.
          content:
            application/json:
              schema:
                type: object
                required: [credential, token]
                properties:
                  credential:
                    $ref: "#/components/schemas/ServiceCredential"
                  token:
                    type: string
                    description: Полный секретный токен для использования в заголовке Authorization
  /api/core/accounts/{accountId}/service-credentials/{credentialId}/rotate:
    post:
      operationId: rotateServiceCredential
      summary: Ротировать существующий сервисный ключ
      description: Генерирует новый токен. Предыдущий токен сохраняет действие на время grace-периода.
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ключ успешно ротирован
          content:
            application/json:
              schema:
                type: object
                required: [credentialId, newToken, previousTokenExpiresAt]
                properties:
                  credentialId:
                    type: string
                    format: uuid
                  newToken:
                    type: string
                  previousTokenExpiresAt:
                    type: string
                    format: date-time
  /api/core/accounts/{accountId}/service-credentials/{credentialId}/revoke:
    post:
      operationId: revokeServiceCredential
      summary: Немедленно отозвать сервисный ключ
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Ключ немедленно отозван
components:
  schemas:
    ServiceCredential:
      type: object
      required: [id, name, prefix, scopes, createdAt, isExpired, isRevoked]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        isExpired:
          type: boolean
        isRevoked:
          type: boolean
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
