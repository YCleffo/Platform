  "openapi": "3.0.3",
  "info": {
    "title": "Education платформы Platform",
    "version": "1.1.0",
    "description": "Необязательный модуль Yii. Каждый запрос проверяет Bearer-пользователя Core, текущие разрешения, активное членство организации и явное назначение преподавателя. X-Education-Organization выбирает область, но не выдаёт доступ. Личные ответы no-store. Дни учитывают IANA-пояс аккаунта. Пагинация по 50 с nextOffset. Первая переписка — между активными преподавателями одной организации."
  },
