  "info": {
    "title": "Platform Education",
    "version": "1.0.0",
    "description": "Optional Yii module. Core bearer identity, current Core permissions, active organization membership and explicit Education teacher assignment are all checked on every request. X-Education-Organization selects scope; it never grants access. Personal responses are no-store. Calendar days use the Core account IANA timezone. Pagination is 50 records with nextOffset. The first messaging workflow is between active Education teachers in the same organization."
  },
