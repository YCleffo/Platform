openapi: 3.1.0
info:
  title: Platform Commercial Control Plane API
  version: 3.9.0
  description: Customer-facing Commercial API. Provider secrets, request keys, raw webhooks and fiscal customer PII are never returned.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      operationId: healthLive
      responses: {'200': {description: Process is live, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}}
  /health/ready:
    get:
      security: []
      operationId: healthReady
      responses: {'200': {description: Dependencies are ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}, '503': {description: Dependencies are not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}}
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200': {description: Ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {description: Not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /api/control/auth/register:
    post:
      security: []
      operationId: register
      requestBody: {$ref: '#/components/requestBodies/EmailPassword'}
      responses: {'201': {$ref: '#/components/responses/Object'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/auth/verification/resend:
    post:
      security: []
      operationId: resendVerification
      requestBody: {$ref: '#/components/requestBodies/Email'}
      responses: {'202': {$ref: '#/components/responses/Object'}, '429': {$ref: '#/components/responses/Error'}}
  /api/control/auth/verify:
    post:
      security: []
      operationId: verifyEmail
      requestBody: {$ref: '#/components/requestBodies/Token'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/auth/login:
    post:
      security: []
      operationId: login
      requestBody: {$ref: '#/components/requestBodies/EmailPassword'}
      responses: {'200': {$ref: '#/components/responses/LoginResult'}, '401': {$ref: '#/components/responses/Error'}}
  /api/control/auth/refresh:
    post:
      security: []
      operationId: refresh
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses: {'200': {$ref: '#/components/responses/Tokens'}, '401': {$ref: '#/components/responses/Error'}}
  /api/control/auth/logout:
    post:
      operationId: logout
      responses: {'204': {description: Logged out}, '401': {$ref: '#/components/responses/Error'}}
  /api/control/auth/password/reset/request:
    post:
      security: []
      operationId: requestPasswordReset
      requestBody: {$ref: '#/components/requestBodies/Email'}
      responses: {'202': {$ref: '#/components/responses/Object'}, '429': {$ref: '#/components/responses/Error'}}
  /api/control/auth/password/reset/confirm:
    post:
      security: []
      operationId: confirmPasswordReset
      requestBody: {$ref: '#/components/requestBodies/ResetConfirm'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}}
  /api/control/auth/password/change:
    post:
      operationId: changePassword
      requestBody: {$ref: '#/components/requestBodies/PasswordChange'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '403': {$ref: '#/components/responses/Error'}}
  /api/control/auth/reauthenticate:
    post:
      operationId: reauthenticate
      description: 'MFA-enabled users must provide exactly one of code or recovery_code; non-MFA users provide neither. A successful MFA step-up updates the current authentication method and recent MFA evidence atomically.'
      requestBody: {$ref: '#/components/requestBodies/Reauthenticate'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}}
  /api/control/auth/mfa/status:
    get:
      operationId: mfaStatus
      responses: {'200': {$ref: '#/components/responses/MfaStatus'}}
  /api/control/auth/mfa/totp/setup:
    post:
      operationId: beginTotpSetup
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'201': {$ref: '#/components/responses/Object'}, '403': {$ref: '#/components/responses/Error'}}
  /api/control/auth/mfa/totp/confirm:
    post:
      operationId: confirmTotpSetup
      requestBody: {$ref: '#/components/requestBodies/TotpConfirm'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}}
  /api/control/auth/mfa/login/verify:
    post:
      security: []
      operationId: verifyMfaLogin
      description: Provide exactly one of code or recovery_code.
      requestBody: {$ref: '#/components/requestBodies/MfaVerify'}
      responses: {'200': {$ref: '#/components/responses/Tokens'}, '400': {$ref: '#/components/responses/Error'}}
  /api/control/auth/mfa/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '403': {$ref: '#/components/responses/Error'}}
  /api/control/auth/mfa/disable:
    post:
      operationId: disableMfa
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {description: MFA disabled}, '403': {$ref: '#/components/responses/Error'}}
  /api/control/auth/sessions:
    get:
      operationId: listSessions
      responses: {'200': {$ref: '#/components/responses/Sessions'}}
  /api/control/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses: {'204': {description: Session revoked}, '403': {$ref: '#/components/responses/Error'}}
  /api/control/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {description: Other sessions revoked}, '403': {$ref: '#/components/responses/Error'}}
  /api/control/catalog/plans:
    get:
      security: []
      operationId: listPlans
      responses: {'200': {$ref: '#/components/responses/Object'}}
  /api/control/accounts:
    post:
      operationId: createAccount
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'201': {$ref: '#/components/responses/Object'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    get:
      operationId: getAccount
      responses: {'200': {$ref: '#/components/responses/Object'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/memberships:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    post:
      operationId: addMembership
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'201': {$ref: '#/components/responses/Object'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/memberships/{membershipId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/MembershipId'}]
    patch:
      operationId: changeMembershipRole
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'204': {description: Updated}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      operationId: removeMembership
      responses: {'204': {description: Removed}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/billing-profile:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    put:
      operationId: saveBillingProfile
      requestBody: {$ref: '#/components/requestBodies/BillingProfile'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/onboarding/catalog-reviewed:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    post:
      operationId: markCatalogReviewed
      responses: {'200': {description: 'Onboarding state updated', content: {application/json: {schema: {type: object, required: [onboarding_state], properties: {onboarding_state: {const: ready_for_subscription}}}}}}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/subscriptions:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    post:
      operationId: createSubscription
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateSubscription'}
      responses: {'201': {$ref: '#/components/responses/SubscriptionCreated'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/subscriptions/{subscriptionId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/SubscriptionId'}]
    get:
      operationId: getSubscription
      responses: {'200': {$ref: '#/components/responses/Subscription'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/subscriptions/{subscriptionId}/cancel:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/SubscriptionId'}]
    post:
      operationId: cancelSubscription
      description: An open scheduled, payment-required, or paid-unapplied plan change must be resolved before the source subscription can be cancelled.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Subscription'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/subscriptions/{subscriptionId}/auto-renew/cancel:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/SubscriptionId'}]
    post:
      operationId: cancelSubscriptionAutoRenewal
      description: Requires billing.manage and recent MFA. Keeps the active paid period and stops later renewal invoices and saved-card charges. An unpaid issued renewal invoice is voided if no provider attempt is pending. A paid renewal remains effective. A pending attempt or open plan change must first be reconciled or resolved.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/AutoRenewalDisabled'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/subscriptions/{subscriptionId}/plan-changes:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/SubscriptionId'}]
    post:
      operationId: requestSubscriptionPlanChange
      description: Requires billing.manage and recent MFA. Upgrade takes effect only after trusted payment settlement; downgrade is scheduled for the current period end.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PlanChange'}
      responses: {'201': {$ref: '#/components/responses/PlanChangeRequested'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/plan-changes/{changeId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/PlanChangeId'}]
    get:
      operationId: getSubscriptionPlanChange
      responses: {'200': {$ref: '#/components/responses/PlanChange'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/plan-changes/{changeId}/cancel:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/PlanChangeId'}]
    post:
      operationId: cancelSubscriptionPlanChange
      description: Requires billing.manage and recent MFA. Cancellation is allowed before settlement when no payment attempt is pending.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/PlanChangeCancelled'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/finance/plan-change-compensations/{changeId}:
    parameters: [{$ref: '#/components/parameters/PlanChangeId'}]
    get:
      operationId: getExternalPlanChangeCompensation
      description: Restricted to active Platform financial operators. Returns the immutable evidence reference for independent review.
      responses: {'200': {$ref: '#/components/responses/ExternalCompensation'}, '404': {$ref: '#/components/responses/Error'}}
    post:
      operationId: proposeExternalPlanChangeCompensation
      description: Requires a financial operator and recent MFA. Records an attestation of an already executed full external refund; does not send money.
      requestBody: {$ref: '#/components/requestBodies/ExternalCompensationEvidence'}
      responses: {'201': {$ref: '#/components/responses/ExternalCompensation'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/finance/plan-change-compensations/attestations/{attestationId}/approve:
    parameters: [{$ref: '#/components/parameters/AttestationId'}]
    post:
      operationId: approveExternalPlanChangeCompensation
      description: A distinct active financial operator with recent MFA must confirm the same transfer and document. Only then is paid_unapplied released.
      requestBody: {$ref: '#/components/requestBodies/ExternalCompensationEvidence'}
      responses: {'200': {$ref: '#/components/responses/ExternalCompensation'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/finance/plan-change-compensations/attestations/{attestationId}/reject:
    parameters: [{$ref: '#/components/parameters/AttestationId'}]
    post:
      operationId: rejectExternalPlanChangeCompensation
      description: A distinct active financial operator with recent MFA rejects the proposal with a reason. The financial block remains.
      requestBody: {$ref: '#/components/requestBodies/ExternalCompensationRejection'}
      responses: {'200': {$ref: '#/components/responses/ExternalCompensation'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/subscriptions/{subscriptionId}/invoice:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/SubscriptionId'}]
    post:
      operationId: issueInitialInvoice
      description: Issues only a subscription_create invoice. Renewal invoices are prepared by the bounded internal scheduler.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {$ref: '#/components/responses/Invoice'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/invoices/{invoiceId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/InvoiceId'}]
    get:
      operationId: getInvoice
      responses: {'200': {$ref: '#/components/responses/Invoice'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/invoices/{invoiceId}/payment:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/InvoiceId'}]
    post:
      operationId: createPayment
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {$ref: '#/components/responses/Payment'}, '409': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/payments/{paymentId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/PaymentId'}]
    get:
      operationId: getPayment
      responses: {'200': {$ref: '#/components/responses/Payment'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/payments/{paymentId}/checkout:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/PaymentId'}]
    post:
      operationId: startCheckout
      description: An identical Idempotency-Key and request replay the original attempt, including after authoritative settlement. A new checkout is rejected once the payment is settled.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Checkout'}
      responses: {'200': {$ref: '#/components/responses/CheckoutResult'}, '503': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/payment-methods:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    get:
      operationId: listSavedPaymentMethods
      responses: {'200': {$ref: '#/components/responses/SavedPaymentMethods'}}
  /api/control/accounts/{accountId}/payment-methods/{methodId}/default:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {name: methodId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: setDefaultSavedPaymentMethod
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'200': {$ref: '#/components/responses/SavedPaymentMethod'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/payment-methods/{methodId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {name: methodId, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      operationId: disableSavedPaymentMethod
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'204': {description: Saved payment method disabled}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/payments/{paymentId}/receipt:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/PaymentId'}]
    get:
      operationId: getPaymentReceipt
      responses: {'200': {$ref: '#/components/responses/Receipt'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/payments/{paymentId}/refunds:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/PaymentId'}]
    post:
      operationId: createRefund
      description: Requires billing.manage. Same Idempotency-Key and payload returns the same refund; a changed payload conflicts. Provider idempotency is separate and never exposed.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateRefund'}}}
      responses: {'201': {$ref: '#/components/responses/Refund'}, '409': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
    get:
      operationId: listPaymentRefunds
      responses:
        '200':
          description: Refund history
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Refund'}}}}}}
  /api/control/accounts/{accountId}/refunds/{refundId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}, {$ref: '#/components/parameters/RefundId'}]
    get:
      operationId: getRefund
      responses: {'200': {$ref: '#/components/responses/Refund'}, '404': {$ref: '#/components/responses/Error'}}
  /api/control/accounts/{accountId}/entitlements:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    get: {operationId: getEntitlements, responses: {'200': {$ref: '#/components/responses/EffectiveEntitlements'}}}
  /api/control/accounts/{accountId}/usage:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    get: {operationId: getUsage, responses: {'200': {$ref: '#/components/responses/Object'}}}
  /api/control/webhooks/yookassa:
    post:
      security: []
      operationId: receiveYooKassaWebhook
      description: Hash-only inbox. Notification data is never financial proof; payment/refund state is authoritatively re-fetched.
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '503': {$ref: '#/components/responses/Error'}}
  /api/control/privacy/me/export:
    get:
      operationId: exportMyPersonalData
      description: Returns the authenticated Control Plane user's export. Response is no-store.
      responses: {'200': {$ref: '#/components/responses/Object'}, '401': {$ref: '#/components/responses/Error'}}
  /api/control/privacy/operator/requests/intake:
    post:
      operationId: intakePrivacySubjectRequest
      requestBody: {$ref: '#/components/requestBodies/PrivacyRequestIntake'}
      responses: {'201': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/privacy/operator/requests/{id}/resolve:
    parameters: [{$ref: '#/components/parameters/PrivacyRequestId'}]
    post:
      operationId: resolvePrivacySubjectRequest
      requestBody: {$ref: '#/components/requestBodies/PrivacyRequestResolution'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/privacy/operator/incidents:
    post:
      operationId: detectPrivacyIncident
      requestBody: {$ref: '#/components/requestBodies/PrivacyIncidentDetect'}
      responses: {'201': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/privacy/operator/incidents/{id}/events:
    parameters: [{$ref: '#/components/parameters/PrivacyIncidentId'}]
    post:
      operationId: recordPrivacyIncidentEvent
      requestBody: {$ref: '#/components/requestBodies/PrivacyIncidentEvent'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/control/privacy/operator/incidents/{id}/close:
    parameters: [{$ref: '#/components/parameters/PrivacyIncidentId'}]
    post:
      operationId: closePrivacyIncident
      requestBody: {$ref: '#/components/requestBodies/Object'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/m2m/deployment/status:
    post:
      security: [{serviceCredential: []}]
      operationId: reportDeploymentStatus
      requestBody: {$ref: '#/components/requestBodies/DeploymentStatus'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/m2m/entitlements/latest:
    get:
      security: [{serviceCredential: []}]
      operationId: getLatestEntitlement
      responses: {'200': {$ref: '#/components/responses/Entitlement'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/m2m/usage:
    post:
      security: [{serviceCredential: []}]
      operationId: ingestDeploymentUsage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/UsageIngest'}
      responses: {'200': {$ref: '#/components/responses/Object'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    serviceCredential: {type: apiKey, in: header, name: Authorization, description: 'Service credential in the form Service credentialId.credentialSecret.'}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    AccountId: {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
    MembershipId: {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
    SubscriptionId: {name: subscriptionId, in: path, required: true, schema: {type: string, format: uuid}}
    PlanChangeId: {name: changeId, in: path, required: true, schema: {type: string, format: uuid}}
    AttestationId: {name: attestationId, in: path, required: true, schema: {type: string, format: uuid}}
    InvoiceId: {name: invoiceId, in: path, required: true, schema: {type: string, format: uuid}}
    PaymentId: {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
    RefundId: {name: refundId, in: path, required: true, schema: {type: string, format: uuid}}
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    PrivacyRequestId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    PrivacyIncidentId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Object: {required: true, content: {application/json: {schema: {type: object}}}}
    EmptyObject: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, maxProperties: 0}}}}
    BillingProfile:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [legal_name, country_code]
            properties:
              legal_name: {type: string, minLength: 1, maxLength: 240}
              country_code: {type: string, pattern: '^[A-Za-z]{2}$'}
              contact_name: {type: [string, 'null'], maxLength: 200}
              contact_email: {type: [string, 'null'], format: email}
              tax_identifier: {type: [string, 'null'], maxLength: 80}
              address: {type: object, default: {}, description: 'Optional address object; omitted and empty object are stored as an empty JSON object. Arrays and null are rejected.'}
    CreateSubscription: {required: true, content: {application/json: {schema: {type: object, required: [plan_price_id, quantity], properties: {plan_price_id: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}}}
    PlanChange: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [plan_price_id, quantity], properties: {plan_price_id: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}}}
    ExternalCompensationEvidence: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [externalTransactionReference, documentReference, documentSha256], properties: {externalTransactionReference: {type: string, minLength: 1, maxLength: 200}, documentReference: {type: string, pattern: '^urn:'}, documentSha256: {type: string, pattern: '^[0-9a-f]{64}$'}}}}}}
    ExternalCompensationRejection: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [externalTransactionReference, documentReference, documentSha256, rejectionReason], properties: {externalTransactionReference: {type: string, minLength: 1, maxLength: 200}, documentReference: {type: string, pattern: '^urn:'}, documentSha256: {type: string, pattern: '^[0-9a-f]{64}$'}, rejectionReason: {type: string, minLength: 1, maxLength: 500}}}}}}
    Email: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}}
    EmailPassword: {required: true, content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password}}}}}}
    Token: {required: true, content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}}
    RefreshToken: {required: true, content: {application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}}
    ResetConfirm: {required: true, content: {application/json: {schema: {type: object, required: [token, password], properties: {token: {type: string}, password: {type: string, format: password}}}}}}
    PasswordChange: {required: true, content: {application/json: {schema: {type: object, required: [current_password, password], properties: {current_password: {type: string, format: password}, password: {type: string, format: password}}}}}}
    Reauthenticate: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string, format: password}, code: {type: [string, 'null']}, recovery_code: {type: [string, 'null']}}}}}}
    TotpConfirm: {required: true, content: {application/json: {schema: {type: object, required: [factor_id, code], properties: {factor_id: {type: string, format: uuid}, code: {type: string}}}}}}
    MfaVerify: {required: true, content: {application/json: {schema: {type: object, required: [challenge_token], properties: {challenge_token: {type: string}, code: {type: [string, 'null']}, recovery_code: {type: [string, 'null']}}}}}}
    Checkout:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [provider, method]
            properties:
              provider: {const: yookassa}
              method: {type: string, enum: [sbp, bank_card]}
              save_payment_method:
                type: boolean
                default: false
                description: Applies only to bank_card. Card entry remains on the provider-hosted checkout page; raw card data is never accepted by this API.
    PrivacyRequestIntake: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true, description: 'Verified-subject request intake fields accepted by the operator workflow.'}}}}
    PrivacyRequestResolution: {required: true, content: {application/json: {schema: {type: object, properties: {contactName: {type: [string, 'null']}, contactEmail: {type: [string, 'null'], format: email}, responseEvidenceReference: {type: [string, 'null']}}}}}}
    PrivacyIncidentDetect: {required: true, content: {application/json: {schema: {type: object, required: [detectedAt, categories], properties: {detectedAt: {type: string, format: date-time}, categories: {type: array, items: {type: string}}, estimatedSubjects: {type: integer, minimum: 0}}}}}}
    PrivacyIncidentEvent: {required: true, content: {application/json: {schema: {type: object, required: [eventCode, evidenceReference], properties: {eventCode: {type: string}, evidenceReference: {type: string}}}}}}
    DeploymentStatus: {required: true, content: {application/json: {schema: {oneOf: [{type: object, required: [status, entitlementSequence], properties: {status: {const: ready}, entitlementSequence: {type: integer, minimum: 0}}}, {type: object, required: [status, errorCode], properties: {status: {const: failed}, errorCode: {type: string}}}]}}}}
    UsageIngest: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [featureCode, delta], properties: {featureCode: {type: string}, delta: {type: integer, not: {const: 0}}}}}}}
  responses:
    Object: {description: Success, content: {application/json: {schema: {type: object}}}}
    SavedPaymentMethods: {description: Saved payment methods without provider secrets, content: {application/json: {schema: {type: object, additionalProperties: false, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SavedPaymentMethod'}}}}}}}
    SavedPaymentMethod: {description: Updated saved payment method without provider secrets, content: {application/json: {schema: {$ref: '#/components/schemas/SavedPaymentMethod'}}}}
    EffectiveEntitlements: {description: Current commercial access for the account, content: {application/json: {schema: {$ref: '#/components/schemas/EffectiveEntitlements'}}}}
    Tokens: {description: Session tokens, content: {application/json: {schema: {type: object, required: [access_token, refresh_token], properties: {access_token: {type: string}, refresh_token: {type: string}}}}}}
    LoginResult: {description: Tokens or an MFA challenge, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Tokens'}, {$ref: '#/components/schemas/MfaChallenge'}]}}}}
    MfaStatus: {description: MFA state, content: {application/json: {schema: {$ref: '#/components/schemas/MfaStatus'}}}}
    Sessions: {description: Owned sessions only, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Session'}}}}}}}
    Subscription: {description: Subscription, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
    SubscriptionCreated: {description: Created draft subscription, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCreated'}}}}
    AutoRenewalDisabled: {description: Auto-renewal disabled, active paid period retained, content: {application/json: {schema: {$ref: '#/components/schemas/AutoRenewalDisabled'}}}}
    PlanChangeRequested: {description: Requested plan change, content: {application/json: {schema: {$ref: '#/components/schemas/PlanChangeRequested'}}}}
    PlanChange: {description: Plan change with immutable calculation and current payment state, content: {application/json: {schema: {$ref: '#/components/schemas/PlanChange'}}}}
    PlanChangeCancelled: {description: Cancelled plan change, content: {application/json: {schema: {$ref: '#/components/schemas/PlanChangeCancelled'}}}}
    ExternalCompensation: {description: External full-refund attestation with two-person review state, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalCompensation'}}}}
    Invoice: {description: Invoice, content: {application/json: {schema: {$ref: '#/components/schemas/Invoice'}}}}
    Payment: {description: Payment, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
    CheckoutResult: {description: Provider checkout initiation, content: {application/json: {schema: {$ref: '#/components/schemas/CheckoutResult'}}}}
    Refund: {description: Refund, content: {application/json: {schema: {$ref: '#/components/schemas/Refund'}}}}
    Receipt: {description: Sanitized fiscal receipt, content: {application/json: {schema: {$ref: '#/components/schemas/Receipt'}}}}
    Entitlement: {description: Signed entitlement package for the authenticated deployment, content: {application/json: {schema: {type: object, required: [documentBase64, signatureBase64, keyId], properties: {documentBase64: {type: string}, signatureBase64: {type: string}, keyId: {type: string}}}}}}
    Error: {description: Sanitized error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    ExternalCompensation:
      type: object
      additionalProperties: false
      required: [id, plan_change_id, payment_id, amount_minor, currency, external_transaction_reference, document_reference, document_sha256, proposed_by, status, reviewed_by, rejection_reason]
      properties:
        id: {type: string, format: uuid}
        plan_change_id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        amount_minor: {type: integer, minimum: 1}
        currency: {type: string, minLength: 3, maxLength: 3}
        external_transaction_reference: {type: string}
        document_reference: {type: string}
        document_sha256: {type: string}
        proposed_by: {type: string, format: uuid}
        status: {type: string, enum: [proposed, approved, rejected]}
        reviewed_by: {type: [string, 'null'], format: uuid}
        rejection_reason: {type: [string, 'null']}
    EffectiveEntitlements:
      type: object
      additionalProperties: false
      required: [commercial_account_id, subscription, features]
      properties:
        commercial_account_id: {type: string, format: uuid}
        subscription:
          oneOf:
            - {type: 'null'}
            - {type: object, additionalProperties: false, required: [id, current_period_start, current_period_end, billing_status, past_due_since, grace_until], properties: {id: {type: string, format: uuid}, current_period_start: {type: string, format: date-time}, current_period_end: {type: string, format: date-time}, billing_status: {type: string, enum: [current, past_due]}, past_due_since: {type: [string, 'null'], format: date-time}, grace_until: {type: [string, 'null'], format: date-time}}}
        features: {type: object, additionalProperties: true, description: Published plan feature codes mapped to their JSON values. Empty when access has expired.}
    SavedPaymentMethod:
      type: object
      additionalProperties: false
      required: [id, method_type, status, title, card_brand, last4, expiry_month, expiry_year, is_default, created_at, last_used_at, disabled_at]
      properties:
        id: {type: string, format: uuid}
        method_type: {type: string}
        status: {type: string, enum: [active, disabled, provider_unusable]}
        title: {type: [string, 'null']}
        card_brand: {type: [string, 'null']}
        last4: {type: [string, 'null'], pattern: '^[0-9]{4}$'}
        expiry_month: {type: [integer, 'null'], minimum: 1, maximum: 12}
        expiry_year: {type: [integer, 'null'], minimum: 2000, maximum: 9999}
        is_default: {type: boolean}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        disabled_at: {type: [string, 'null'], format: date-time}
    SubscriptionCreated: {type: object, additionalProperties: false, required: [id, status], properties: {id: {type: string, format: uuid}, status: {const: draft}}}
    AutoRenewalDisabled: {type: object, additionalProperties: false, required: [id, auto_renew_enabled], properties: {id: {type: string, format: uuid}, auto_renew_enabled: {const: false}}}
    PlanChangeRequested:
      type: object
      additionalProperties: false
      required: [id, status, change_kind, source_subscription_id, target_subscription_id, invoice_id, amount_due_minor, currency]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [scheduled, payment_required, applied]}
        change_kind: {type: string, enum: [upgrade, downgrade]}
        source_subscription_id: {type: string, format: uuid}
        target_subscription_id: {type: string, format: uuid}
        invoice_id: {type: [string, 'null'], format: uuid}
        amount_due_minor: {type: integer, minimum: 0, format: int64}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    PlanChange:
      type: object
      required: [id, source_subscription_id, target_subscription_id, old_plan_price_id, new_plan_price_id, old_quantity, new_quantity, change_kind, status, compensation_status, compensation_reason, compensation_origin, calculation, currency, proration_net_minor, amount_due_minor, period_start, period_end, invoice_id, applied_at, invoice_status, payment_id, payment_status]
      properties:
        id: {type: string, format: uuid}
        source_subscription_id: {type: string, format: uuid}
        target_subscription_id: {type: string, format: uuid}
        old_plan_price_id: {type: string, format: uuid}
        new_plan_price_id: {type: string, format: uuid}
        old_quantity: {type: integer, minimum: 1}
        new_quantity: {type: integer, minimum: 1}
        change_kind: {type: string, enum: [upgrade, downgrade]}
        status: {type: string, enum: [scheduled, payment_required, applied, cancelled, paid_unapplied, refunded]}
        compensation_status: {type: [string, 'null'], enum: [pending, recovery_required, succeeded, null]}
        compensation_reason: {type: [string, 'null'], description: Machine-readable reason when operator recovery is required.}
        compensation_origin: {type: [string, 'null'], enum: [provider, external, null], description: Confirmed compensation source; null before confirmation or for legacy records without source evidence.}
        calculation: {type: object}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        proration_net_minor: {type: integer, format: int64}
        amount_due_minor: {type: integer, minimum: 0, format: int64}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        invoice_id: {type: [string, 'null'], format: uuid}
        applied_at: {type: [string, 'null'], format: date-time}
        invoice_status: {type: [string, 'null']}
        payment_id: {type: [string, 'null'], format: uuid}
        payment_status: {type: [string, 'null']}
    PlanChangeCancelled: {type: object, additionalProperties: false, required: [id, status], properties: {id: {type: string, format: uuid}, status: {const: cancelled}}}
    Health: {type: object, additionalProperties: false, required: [status], properties: {status: {type: string, enum: [ok, not_ready]}}}
    Error: {type: object, required: [error], properties: {error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}}}
    Tokens: {type: object, required: [access_token, refresh_token], properties: {access_token: {type: string}, refresh_token: {type: string}, access_expires_in: {type: integer}, session_expires_in: {type: integer}}}
    MfaChallenge: {type: object, required: [status, challenge_token, expires_in], properties: {status: {const: mfa_required}, challenge_token: {type: string}, expires_in: {type: integer}}}
    MfaStatus: {type: object, required: [enabled, recovery_codes_remaining], properties: {enabled: {type: boolean}, factor_id: {type: [string, 'null'], format: uuid}, recovery_codes_remaining: {type: integer}}}
    Session: {type: object, required: [id, authentication_method, primary_authenticated_at, current], properties: {id: {type: string, format: uuid}, issued_at: {type: string, format: date-time}, last_used_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time}, revoked_at: {type: [string, 'null'], format: date-time}, revoke_reason: {type: [string, 'null']}, user_agent: {type: string}, authentication_method: {type: string, enum: [password, password_totp, password_recovery]}, primary_authenticated_at: {type: string, format: date-time}, mfa_authenticated_at: {type: [string, 'null'], format: date-time}, current: {type: boolean}}}
    Subscription:
      type: object
      required: [id, status, billing_status, past_due_since, grace_until, auto_renew_enabled, renewal_required]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [draft, active, cancelled, expired]}
        billing_status: {type: string, enum: [current, past_due]}
        past_due_since: {type: [string, 'null'], format: date-time}
        grace_until: {type: [string, 'null'], format: date-time}
        auto_renew_enabled: {type: boolean}
        current_period_start: {type: [string, 'null'], format: date-time}
        current_period_end: {type: [string, 'null'], format: date-time}
        renewal_required: {type: boolean}
        renewal: {oneOf: [{$ref: '#/components/schemas/RenewalState'}, {type: 'null'}]}
    RenewalState:
      type: object
      properties:
        invoice_id: {type: string, format: uuid}
        invoice_status: {type: string, enum: [issued, paid]}
        payment_id: {type: [string, 'null'], format: uuid}
        payment_status: {type: [string, 'null'], enum: [pending, succeeded, cancelled, null]}
        service_period_start: {type: string, format: date-time}
        service_period_end: {type: string, format: date-time}
    Invoice:
      type: object
      required: [id, subscription_id, billing_reason, status, currency, total_minor]
      properties:
        id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        billing_reason: {type: string, enum: [subscription_create, subscription_renewal]}
        status: {type: string, enum: [issued, paid, void]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        total_minor: {type: integer, minimum: 0}
        service_period_start: {type: [string, 'null'], format: date-time}
        service_period_end: {type: [string, 'null'], format: date-time}
    Payment:
      type: object
      required: [id, invoice_id, status, currency, amount_minor, refunded_minor, refundable_minor]
      properties:
        id: {type: string, format: uuid}
        invoice_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, waiting_for_capture, succeeded, cancelled]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        amount_minor: {type: integer, minimum: 0}
        refunded_minor: {type: integer, minimum: 0}
        refundable_minor: {type: integer, minimum: 0}
    CheckoutResult:
      type: object
      additionalProperties: false
      required: [payment_id, attempt_id, provider, method, status, confirmation]
      properties:
        payment_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        provider: {const: yookassa}
        method: {type: string, enum: [sbp, bank_card]}
        status: {type: string, enum: [pending, succeeded, cancelled]}
        confirmation:
          oneOf:
            - {type: 'null'}
            - {type: object, additionalProperties: false, required: [type, url], properties: {type: {const: redirect}, url: {type: string, format: uri}}}
    CreateRefund:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RefundItemInput'}}
    RefundItemInput:
      type: object
      additionalProperties: false
      required: [invoice_line_id, quantity, unit_amount_minor]
      properties:
        invoice_line_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        unit_amount_minor: {type: integer, minimum: 0}
    Refund:
      type: object
      required: [id, payment_id, amount_minor, currency, status, created_at]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        amount_minor: {type: integer, minimum: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {type: string, enum: [pending, succeeded, canceled]}
        provider_refund_id: {type: [string, 'null'], description: Non-secret provider reference}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/RefundItem'}}
        receipt: {oneOf: [{$ref: '#/components/schemas/Receipt'}, {type: 'null'}]}
    RefundItem:
      allOf:
        - {$ref: '#/components/schemas/RefundItemInput'}
        - {type: object, properties: {description: {type: string}, total_minor: {type: integer, minimum: 1}, currency: {type: string}, vat_code: {type: integer}, payment_subject: {type: string}, payment_mode: {type: string}}}
    Receipt:
      type: object
      required: [id, type, status, amount_minor, currency]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [payment, refund]}
        status: {type: string, enum: [pending, succeeded, canceled]}
        external_receipt_id: {type: [string, 'null']}
        amount_minor: {type: integer, minimum: 1}
        currency: {type: string}
