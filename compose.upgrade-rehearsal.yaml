# Disposable copies only. No development/test volumes, credentials or host ports.
services:
  core-db:
    image: postgres:18
    labels: &labels
      platform.rehearsal: 'true'
      platform.rehearsal.run: '${REHEARSAL_RUN_ID:?}'
    command: [postgres, -c, cluster_name=platform-upgrade-rehearsal-core]
    environment:
      POSTGRES_USER: rehearsal_admin
      POSTGRES_PASSWORD: '${REHEARSAL_CORE_ADMIN_PASSWORD:?}'
      POSTGRES_DB: platform_core_upgrade
    volumes: [core_copy:/var/lib/postgresql]
    networks: [core_only]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rehearsal_admin -d platform_core_upgrade']
      interval: 2s
      timeout: 2s
      retries: 30
  commercial-db:
    image: postgres:18
    labels: *labels
    command: [postgres, -c, cluster_name=platform-upgrade-rehearsal-commercial]
    environment:
      POSTGRES_USER: rehearsal_admin
      POSTGRES_PASSWORD: '${REHEARSAL_COMMERCIAL_ADMIN_PASSWORD:?}'
      POSTGRES_DB: platform_commercial_upgrade
    volumes: [commercial_copy:/var/lib/postgresql]
    networks: [commercial_only]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rehearsal_admin -d platform_commercial_upgrade']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine
    labels: *labels
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [core_only]
  core:
    image: platform-upgrade-core:local
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: prod
    labels: *labels
    environment: &core_env
      APP_ENV: test
      APP_DEBUG: 'false'
      DB_HOST: core-db
      DB_PORT: '5432'
      DB_NAME: platform_core_upgrade
      DB_USER: core_runtime
      DB_PASSWORD: '${REHEARSAL_CORE_RUNTIME_PASSWORD:?}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      AUTH_TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_IDENTIFIER_HMAC_KEY: synthetic-rehearsal-key-not-production-32
      DEVICE_FINGERPRINT_KEY: synthetic-rehearsal-fingerprint-key-32
      CORE_SCHEDULER_ENABLED: 'false'
      CORE_EMAIL_WORKER_ENABLED: 'false'
      CORE_PRIVACY_ERASURE_ENABLED: 'false'
      CORE_PRIVACY_CLEANUP_ENABLED: 'false'
    networks: [core_only]
    volumes:
      - ./scripts/database/rehearsal:/rehearsal:ro
  core-migrate:
    image: postgres:18
    labels: *labels
    environment:
      POSTGRES_DB: platform_core_upgrade
      POSTGRES_USER: core_migrator
      POSTGRES_PASSWORD: '${REHEARSAL_CORE_MIGRATOR_PASSWORD:?}'
      PGHOST: core-db
      PGOPTIONS: '-c role=core_owner'
    volumes:
      - ./apps/backend/migrations/sql:/migrations:ro
      - ./infra/postgres/migrate.sh:/migrate.sh:ro
    entrypoint: [bash, /migrate.sh]
    networks: [core_only]
  control:
    image: platform-upgrade-control:local
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: test
    labels: *labels
    environment: &control_env
      APP_ENV: test
      APP_DEBUG: '0'
      SERVER_NAME: ':8000'
      SERVER_ROOT: public/
      CONTROL_DATABASE_URL: 'postgresql://commercial_runtime:${REHEARSAL_COMMERCIAL_RUNTIME_PASSWORD:?}@commercial-db:5432/platform_commercial_upgrade?serverVersion=18&charset=utf8'
      CONTROL_APP_SECRET: synthetic-rehearsal-app-secret-not-production-32
      CONTROL_TOKEN_SECRET: synthetic-rehearsal-token-secret-not-production-32
      CONTROL_TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CONTROL_MAILER_DSN: null://null
      CONTROL_MAIL_FROM: no-reply@example.test
      CONTROL_VERIFICATION_URL: http://localhost:18082/verify-email
      CONTROL_PASSWORD_RESET_URL: http://localhost:18082/reset-password
      CONTROL_MESSAGE_ID_DOMAIN: example.test
      CONTROL_VERIFICATION_TTL_SECONDS: '86400'
      CONTROL_ACCESS_TOKEN_TTL_SECONDS: '900'
      CONTROL_SESSION_TTL_SECONDS: '86400'
      CONTROL_PASSWORD_RESET_TTL_SECONDS: '3600'
      CONTROL_MFA_CHALLENGE_TTL_SECONDS: '300'
      CONTROL_TOTP_SETUP_TTL_SECONDS: '600'
      CONTROL_RECENT_AUTH_TTL_SECONDS: '900'
      CONTROL_YOOKASSA_RETURN_URL: https://platform.example/payments/return
      CONTROL_RENEWAL_LEAD_DAYS: '7'
      CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS: '900'
      CONTROL_DEPLOYMENT_CREDENTIAL_TTL_DAYS: '30'
      CONTROL_DUNNING_MAX_ATTEMPTS: '5'
      CONTROL_DUNNING_RETRY_DELAYS_SECONDS: '3600,21600,86400,259200'
      CONTROL_DUNNING_GRACE_SECONDS: '604800'
      CONTROL_DUNNING_UNCERTAIN_RETRY_SECONDS: '300'
      CONTROL_SCHEDULER_ENABLED: 'false'
      CONTROL_OUTBOX_WORKER_ENABLED: 'false'
      PLATFORM_BASE_DOMAIN: platform.example
    networks: [commercial_only]
    volumes:
      - ./scripts/database/rehearsal:/rehearsal:ro
  control-migrate:
    image: platform-upgrade-control:local
    labels: *labels
    environment:
      <<: *control_env
      CONTROL_DATABASE_URL: 'postgresql://commercial_migrator:${REHEARSAL_COMMERCIAL_MIGRATOR_PASSWORD:?}@commercial-db:5432/platform_commercial_upgrade?serverVersion=18&charset=utf8'
      PGOPTIONS: '-c role=commercial_owner'
    command: [php, bin/console, doctrine:migrations:migrate, --no-interaction]
    networks: [commercial_only]
volumes:
  core_copy:
  commercial_copy:
networks:
  core_only: {internal: true}
  commercial_only: {internal: true}
