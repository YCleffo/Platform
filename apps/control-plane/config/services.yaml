parameters:
    env(CONTROL_PRIVACY_RETENTION_DAYS): '{}'
    env(CONTROL_ENTITLEMENT_SECRET_FILES): '{}'
    env(CONTROL_PRIVACY_OPERATOR_NOTIFICATION): '{}'
    env(CONTROL_PRIVACY_PROCESSING_ROLES): '{}'
    env(CONTROL_PRIVACY_RESIDENCY): '{}'
    env(CONTROL_PRIVACY_PROVIDER_DECISIONS): '{}'
    env(CONTROL_PRIVACY_SECURITY_REFERENCES): '{}'
    env(CONTROL_PRIVACY_ERASURE_POLICY_APPROVED): 'false'
    env(CONTROL_PRIVACY_IDENTITY_RETENTION_DAYS): '-1'
    env(CONTROL_PRIVACY_BILLING_CONTACT_RETENTION_DAYS): '-1'
    # Deployment must set reviewed per-category periods before cleanup can run.
    control_privacy_retention_days: '%env(json:CONTROL_PRIVACY_RETENTION_DAYS)%'
    control_privacy_operator_notification: '%env(json:CONTROL_PRIVACY_OPERATOR_NOTIFICATION)%'
    control_privacy_erasure_policy_approved: '%env(bool:CONTROL_PRIVACY_ERASURE_POLICY_APPROVED)%'
    control_privacy_identity_retention_days: '%env(int:CONTROL_PRIVACY_IDENTITY_RETENTION_DAYS)%'
    control_privacy_billing_contact_retention_days: '%env(int:CONTROL_PRIVACY_BILLING_CONTACT_RETENTION_DAYS)%'
    control_privacy_processing_roles: '%env(json:CONTROL_PRIVACY_PROCESSING_ROLES)%'
    control_privacy_residency: '%env(json:CONTROL_PRIVACY_RESIDENCY)%'
    control_privacy_provider_decisions: '%env(json:CONTROL_PRIVACY_PROVIDER_DECISIONS)%'
    control_privacy_security_references: '%env(json:CONTROL_PRIVACY_SECURITY_REFERENCES)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    ControlPlane\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'

    ControlPlane\Infrastructure\Http\HealthController:
        tags: ['controller.service_arguments']

    ControlPlane\Infrastructure\Http\PrivacyController:
        tags: ['controller.service_arguments']

    ControlPlane\Identity\Security\TokenCodec:
        arguments:
            $secret: '%env(CONTROL_TOKEN_SECRET)%'

    ControlPlane\Identity\Application\AuthService:
        arguments:
            $verificationTtlSeconds: '%env(int:CONTROL_VERIFICATION_TTL_SECONDS)%'
            $accessTokenTtlSeconds: '%env(int:CONTROL_ACCESS_TOKEN_TTL_SECONDS)%'
            $sessionTtlSeconds: '%env(int:CONTROL_SESSION_TTL_SECONDS)%'

    ControlPlane\Deployment\Application\ReserveDeployment:
        arguments:
            $baseDomain: '%env(PLATFORM_BASE_DOMAIN)%'

    ControlPlane\Deployment\Application\RequestDeploymentDecommission:
        arguments:
            $environment: '%env(APP_ENV)%'

    ControlPlane\Provisioning\DeploymentInfrastructureProvider:
        alias: ControlPlane\Provisioning\LocalDockerInfrastructureProvider

    ControlPlane\Provisioning\ProvisioningSecretStore:
        alias: ControlPlane\Provisioning\LocalProvisioningSecretStore

    ControlPlane\Provisioning\DeploymentBackupEvidenceReader:
        alias: ControlPlane\Provisioning\LocalDeploymentBackupEvidenceReader

    ControlPlane\Provisioning\LocalDeploymentBackupEvidenceReader:
        arguments:
            $directory: '/backups/deployments'
            $environment: '%env(APP_ENV)%'

    ControlPlane\Provisioning\LocalDockerInfrastructureProvider:
        arguments:
            $environment: '%env(APP_ENV)%'
            $controlNetwork: '%env(PROVISIONER_CONTROL_NETWORK)%'
            $controlUrl: '%env(PROVISIONER_CONTROL_PLANE_URL)%'
            $migratorImage: '%env(PROVISIONER_MIGRATOR_IMAGE)%'
            $backupNetwork: '%env(PROVISIONER_BACKUP_NETWORK)%'
            $redisImage: '%env(PROVISIONER_RUNTIME_REDIS_IMAGE)%'
            $readyTimeout: '%env(int:RUNTIME_ACTIVATION_READY_TIMEOUT_SECONDS)%'

    ControlPlane\Provisioning\ReconcileDeploymentInfrastructureCommand:
        arguments:
            $environment: '%env(APP_ENV)%'

    ControlPlane\Provisioning\LocalProvisioningSecretStore:
        arguments:
            $directory: '/run/provisioning-secrets'
            $hostDirectory: '%env(PROVISIONER_SECRET_HOST_DIR)%'
            $environment: '%env(APP_ENV)%'

    ControlPlane\Provisioning\ProvisionDeploymentExecutor:
        arguments:
            $environment: '%env(APP_ENV)%'
            $maxAttempts: '%env(int:PROVISIONER_MAX_ATTEMPTS)%'
            $retryBaseSeconds: '%env(int:PROVISIONER_RETRY_BASE_SECONDS)%'

    ControlPlane\Provisioning\DeprovisionDeploymentExecutor:
        arguments:
            $environment: '%env(APP_ENV)%'
            $maxAttempts: '%env(int:PROVISIONER_MAX_ATTEMPTS)%'
            $retryBaseSeconds: '%env(int:PROVISIONER_RETRY_BASE_SECONDS)%'
            $backupCheckIntervalSeconds: '%env(int:DECOMMISSION_BACKUP_CHECK_INTERVAL_SECONDS)%'

    ControlPlane\Infrastructure\Logging\CorrelationIdProcessor:
        tags: ['monolog.processor']

    ControlPlane\Payment\Provider\PaymentProviderSecretResolver:
        alias: ControlPlane\Payment\Provider\YooKassa\EnvPaymentProviderSecretResolver

    ControlPlane\Payment\Provider\PaymentProviderGateway:
        alias: ControlPlane\Payment\Provider\YooKassa\YooKassaGateway

    ControlPlane\Payment\Provider\FiscalReceiptProviderGateway:
        alias: ControlPlane\Payment\Provider\YooKassa\YooKassaReceiptGateway

    ControlPlane\Payment\Provider\RefundProviderGateway:
        alias: ControlPlane\Payment\Provider\YooKassa\YooKassaRefundGateway

    ControlPlane\Payment\Provider\YooKassa\YooKassaGateway:
        arguments:
            $returnUrl: '%env(CONTROL_YOOKASSA_RETURN_URL)%'
            $egress: '@ControlPlane\Privacy\ControlProviderEgressPolicy'

    ControlPlane\Payment\Provider\YooKassa\YooKassaReceiptGateway:
        arguments:
            $egress: '@ControlPlane\Privacy\ControlProviderEgressPolicy'

    ControlPlane\Payment\Provider\YooKassa\YooKassaRefundGateway:
        arguments:
            $egress: '@ControlPlane\Privacy\ControlProviderEgressPolicy'

    ControlPlane\Subscription\Application\ExpireSubscription:
        arguments:
            $graceSeconds: '%env(int:CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS)%'

    ControlPlane\Infrastructure\Console\PrepareRenewalsCommand:
        arguments:
            $leadDays: '%env(int:CONTROL_RENEWAL_LEAD_DAYS)%'

    ControlPlane\Infrastructure\Console\SchedulerRunCommand:
        arguments:
            $leadDays: '%env(int:CONTROL_RENEWAL_LEAD_DAYS)%'

    ControlPlane\M2m\DeploymentCredentialLifetime:
        arguments:
            $ttlDays: '%env(CONTROL_DEPLOYMENT_CREDENTIAL_TTL_DAYS)%'

    ControlPlane\Infrastructure\Console\CheckCommercialDatabaseCommand:
        arguments:
            $databaseUrl: '%env(resolve:CONTROL_DATABASE_URL)%'

    ControlPlane\Infrastructure\Outbox\EmailTransport:
        alias: ControlPlane\Infrastructure\Outbox\SmtpEmailTransport

    ControlPlane\Infrastructure\Outbox\SmtpEmailTransport:
        arguments:
            $dsn: '%env(CONTROL_MAILER_DSN)%'
            $fromAddress: '%env(CONTROL_MAIL_FROM)%'
            $egress: '@ControlPlane\Privacy\ControlProviderEgressPolicy'

    ControlPlane\Infrastructure\Outbox\VerificationEmailProcessor:
        arguments:
            $verificationUrl: '%env(CONTROL_VERIFICATION_URL)%'
            $messageIdDomain: '%env(CONTROL_MESSAGE_ID_DOMAIN)%'

    ControlPlane\Privacy\ControlPrivacyRetentionPolicy:
        arguments:
            $daysByCategory: '%control_privacy_retention_days%'

    ControlPlane\Entitlement\Application\SigningKeyResolver:
        alias: ControlPlane\Entitlement\Application\FileSigningKeyResolver

    ControlPlane\Entitlement\Application\FileSigningKeyResolver:
        arguments:
            $filesByReference: '%env(json:CONTROL_ENTITLEMENT_SECRET_FILES)%'

    ControlPlane\Privacy\ControlPersonalDataExporter:
        arguments:
            $contributors:
                - '@ControlPlane\Privacy\IdentityPersonalDataContributor'
                - '@ControlPlane\Privacy\SecurityPersonalDataContributor'
                - '@ControlPlane\Privacy\CommercialPersonalDataContributor'

    ControlPlane\Privacy\ControlUserErasure:
        arguments:
            $policyApproved: '%control_privacy_erasure_policy_approved%'
            $identityRetentionDays: '%control_privacy_identity_retention_days%'
            $billingContactRetentionDays: '%control_privacy_billing_contact_retention_days%'

    ControlPlane\Privacy\ControlProcessingRoleRegistry:
        arguments:
            $definitions: '%control_privacy_processing_roles%'

    ControlPlane\Privacy\ControlProviderEgressPolicy:
        arguments:
            $decisions: '%control_privacy_provider_decisions%'

    ControlPlane\Privacy\ControlPrivacyReadinessChecker:
        arguments:
            $operatorNotification: '%control_privacy_operator_notification%'
            $residency: '%control_privacy_residency%'
            $providerDecisions: '%control_privacy_provider_decisions%'
            $securityReferences: '%control_privacy_security_references%'
            $erasurePolicyApproved: '%control_privacy_erasure_policy_approved%'
            $identityRetentionDays: '%control_privacy_identity_retention_days%'
            $billingContactRetentionDays: '%control_privacy_billing_contact_retention_days%'
