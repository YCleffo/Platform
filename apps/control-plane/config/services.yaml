services:
    _defaults:
        autowire: true
        autoconfigure: true

    ControlPlane\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'

    ControlPlane\Infrastructure\Http\HealthController:
        tags: ['controller.service_arguments']

    ControlPlane\Identity\Security\TokenCodec:
        arguments:
            $secret: '%env(CONTROL_TOKEN_SECRET)%'

    ControlPlane\Identity\Application\AuthService:
        arguments:
            $verificationTtlSeconds: '%env(int:CONTROL_VERIFICATION_TTL_SECONDS)%'
            $accessTokenTtlSeconds: '%env(int:CONTROL_ACCESS_TOKEN_TTL_SECONDS)%'
            $sessionTtlSeconds: '%env(int:CONTROL_SESSION_TTL_SECONDS)%'

    ControlPlane\Deployment\Application\ReserveDeployment:
        arguments:
            $baseDomain: '%env(PLATFORM_BASE_DOMAIN)%'

    ControlPlane\Infrastructure\Logging\CorrelationIdProcessor:
        tags: ['monolog.processor']

    ControlPlane\Payment\Provider\PaymentProviderSecretResolver:
        alias: ControlPlane\Payment\Provider\YooKassa\EnvPaymentProviderSecretResolver

    ControlPlane\Payment\Provider\PaymentProviderGateway:
        alias: ControlPlane\Payment\Provider\YooKassa\YooKassaGateway

    ControlPlane\Payment\Provider\FiscalReceiptProviderGateway:
        alias: ControlPlane\Payment\Provider\YooKassa\YooKassaReceiptGateway

    ControlPlane\Payment\Provider\RefundProviderGateway:
        alias: ControlPlane\Payment\Provider\YooKassa\YooKassaRefundGateway

    ControlPlane\Payment\Provider\YooKassa\YooKassaGateway:
        arguments:
            $returnUrl: '%env(CONTROL_YOOKASSA_RETURN_URL)%'

    ControlPlane\Subscription\Application\ExpireSubscription:
        arguments:
            $graceSeconds: '%env(int:CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS)%'

    ControlPlane\Infrastructure\Console\PrepareRenewalsCommand:
        arguments:
            $leadDays: '%env(int:CONTROL_RENEWAL_LEAD_DAYS)%'

    ControlPlane\Infrastructure\Console\CheckCommercialDatabaseCommand:
        arguments:
            $databaseUrl: '%env(resolve:CONTROL_DATABASE_URL)%'

    ControlPlane\Infrastructure\Outbox\EmailTransport:
        alias: ControlPlane\Infrastructure\Outbox\SmtpEmailTransport

    ControlPlane\Infrastructure\Outbox\SmtpEmailTransport:
        arguments:
            $dsn: '%env(CONTROL_MAILER_DSN)%'
            $fromAddress: '%env(CONTROL_MAIL_FROM)%'

    ControlPlane\Infrastructure\Outbox\VerificationEmailProcessor:
        arguments:
            $verificationUrl: '%env(CONTROL_VERIFICATION_URL)%'
            $messageIdDomain: '%env(CONTROL_MESSAGE_ID_DOMAIN)%'
