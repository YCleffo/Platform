services:
    _defaults:
        autowire: true
        autoconfigure: true

    ControlPlane\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'

    ControlPlane\Infrastructure\Http\HealthController:
        tags: ['controller.service_arguments']

    ControlPlane\Identity\Security\TokenCodec:
        arguments:
            $secret: '%env(CONTROL_TOKEN_SECRET)%'

    ControlPlane\Identity\Application\AuthService:
        arguments:
            $verificationTtlSeconds: '%env(int:CONTROL_VERIFICATION_TTL_SECONDS)%'
            $accessTokenTtlSeconds: '%env(int:CONTROL_ACCESS_TOKEN_TTL_SECONDS)%'
            $sessionTtlSeconds: '%env(int:CONTROL_SESSION_TTL_SECONDS)%'

    ControlPlane\Deployment\Application\ReserveDeployment:
        arguments:
            $baseDomain: '%env(PLATFORM_BASE_DOMAIN)%'

    ControlPlane\Infrastructure\Logging\CorrelationIdProcessor:
        tags: ['monolog.processor']
