security:
    password_hashers:
        ControlPlane\Identity\Security\ControlUserPrincipal:
            algorithm: auto
    firewalls:
        m2m:
            pattern: '^/api/m2m/'
            stateless: true
        main:
            stateless: true
            custom_authenticators:
                - ControlPlane\Identity\Security\AccessTokenAuthenticator
            entry_point: ControlPlane\Identity\Security\AccessTokenAuthenticator
    access_control:
        - { path: '^/api/m2m/', roles: PUBLIC_ACCESS }
        - { path: '^/health(?:/(?:live|ready))?$', roles: PUBLIC_ACCESS }
        - { path: '^/api/control/auth/(register|verify|verification/resend|login|refresh|logout|password/reset/(request|confirm)|mfa/login/verify)$', roles: PUBLIC_ACCESS }
- { path: '^/api/control/catalog/plans$', roles: PUBLIC_ACCESS }
- { path: '^/api/control/invitations/preview$', roles: PUBLIC_ACCESS }
- { path: '^/api/control/webhooks/yookassa$', roles: PUBLIC_ACCESS }
        - { path: '^/api/control/', roles: ROLE_CONTROL_USER }
        - { path: '^/', roles: PUBLIC_ACCESS }
