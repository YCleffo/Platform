        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate disposable TLS certificate
        run: |
          mkdir -p "$RUNNER_TEMP/billing-tls"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$RUNNER_TEMP/billing-tls/key.pem" -out "$RUNNER_TEMP/billing-tls/cert.pem" \
            -subj "/CN=e2e.platform.test" -addext "subjectAltName=DNS:e2e.platform.test,DNS:localhost,IP:127.0.0.1"
      - name: Build and start frontend production preview
        working-directory: apps/frontend
        env:
          VITE_COMMERCIAL_PROXY_TARGET: http://127.0.0.1:8091
          VITE_CORE_PROXY_TARGET: http://127.0.0.1:1
          VITE_HTTPS_KEY: ${{ runner.temp }}/billing-tls/key.pem
          VITE_HTTPS_CERT: ${{ runner.temp }}/billing-tls/cert.pem
        run: |
          npm run build
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-billing.log 2>&1 &
          echo $! > /tmp/vite-billing.pid
          for _attempt in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -kfsS https://127.0.0.1:4173/ >/dev/null
      - name: Verify scheduler boundaries, retries, grace and late settlement
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/billing-tls/cert.pem
        working-directory: apps/frontend
        run: npm run test:e2e:periodic-billing
      - name: Upload periodic billing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: billing-periodic
          path: apps/frontend/screenshots/billing-periodic-*
          if-no-files-found: ignore
      - name: Diagnose failed billing runtime
        if: failure()
        run: |
          docker compose --profile control-test logs --no-color --tail 100 control-plane-test control-postgres-test
          cat /tmp/vite-billing.log || true
      - name: Stop isolated billing runtime
        if: always()
        run: |
          if [[ -s /tmp/vite-billing.pid ]]; then kill "$(cat /tmp/vite-billing.pid)" 2>/dev/null || true; fi
          bash scripts/ci/control-test-stop.sh
          rm -f "$BILLING_TEST_CLOCK_DIRECTORY/time" "$RUNNER_TEMP/billing-tls/key.pem" "$RUNNER_TEMP/billing-tls/cert.pem"

  browser-e2e:
    name: Frontend В· browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml:compose.browser.yaml
      COMPOSE_PROJECT_NAME: platform-browser-ci
      POSTGRES_DB: platform_test
      POSTGRES_TEST_DB: platform_test
      POSTGRES_USER: platform_app
      CONTROL_TEST_DB: platform_commercial_test
      CONTROL_TEST_USER: platform_control_test
      CONTROL_TEST_PORT: "8091"
      MAILPIT_TEST_UI_PORT: "8026"
      PLATFORM_BASE_DOMAIN: platform.example
      CONTROL_VERIFICATION_URL: https://e2e.platform.test:4173/verify-email
      CONTROL_INVITATION_URL: https://e2e.platform.test:4173/invitation
      CONTROL_PASSWORD_RESET_URL: https://e2e.platform.test:4173/reset-password
      E2E_ALLOWED_HOSTS: e2e.platform.test
      E2E_RUNTIME: isolated-ci
      E2E_ISOLATED_DB: "1"
      E2E_ALLOW_MUTATIONS: "1"
      APP_URL: https://e2e.platform.test:4173
      CONTROL_API_URL: http://e2e.platform.test:8091
      MAILPIT_URL: http://e2e.platform.test:8026
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD', 'CONTROL_APP_SECRET',
              'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY', 'E2E_ISOLATION_PROOF',
              'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD', 'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          values['E2E_PASSWORD'] = secrets.token_urlsafe(24)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Map disposable browser host alias
        run: echo "127.0.0.1 e2e.platform.test" | sudo tee -a /etc/hosts
      - name: Validate Compose profiles
        run: docker compose --profile control --profile test --profile control-test --profile backup --profile provisioner config --quiet
      - name: Start isolated Commercial database and migrate from empty
        run: bash ./scripts/ci/control-test-start.sh
      - name: Reset disposable Commercial fixtures
        run: env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
      - name: Seed demo catalog for browser flows
        run: bash ./scripts/ci/control-test-seed-catalog.sh
      - name: Start Commercial HTTP runtime and Mailpit
        run: docker compose --profile control-test up -d --wait control-plane-test mailpit-test
      - name: Start the real outbox worker
        run: bash ./scripts/ci/control-email-worker-start.sh
      - name: Set up Node for Playwright
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend dependencies and runner Chromium
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate disposable frontend TLS certificate
        run: |
          mkdir -p /tmp/e2e-cert
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout /tmp/e2e-cert/key.pem -out /tmp/e2e-cert/cert.pem \
            -subj "/CN=e2e.platform.test"
      - name: Start disposable frontend runtime
        working-directory: apps/frontend
        env:
          VITE_COMMERCIAL_PROXY_TARGET: http://127.0.0.1:8091
          VITE_HTTPS_KEY: /tmp/e2e-cert/key.pem
          VITE_HTTPS_CERT: /tmp/e2e-cert/cert.pem
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-e2e.log 2>&1 &
          echo $! > /tmp/vite-e2e.pid
          for _attempt in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8091/health/live
          curl -fsS 'http://127.0.0.1:8026/api/v1/messages?limit=1'
          curl -kfsS https://127.0.0.1:4173/ >/dev/null
      - name: Run browser account workspace flow
        working-directory: apps/frontend
        env:
          FRONTEND09_AUTH_EVIDENCE: '1'
        run: node scripts/e2e-account-workspace.mjs
      - name: Reset disposable Commercial fixtures before invitation flow
        run: |
          docker compose --profile control-test stop control-plane-test
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          docker compose --profile control-test up -d --wait control-plane-test
          bash ./scripts/ci/control-email-worker-start.sh
      - name: Run browser invitation and MFA flow
        working-directory: apps/frontend
        run: node scripts/e2e-invitation-lifecycle.mjs
      - name: Reset disposable Commercial fixtures before recovery flow
        run: |
          docker compose --profile control-test stop control-plane-test
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          docker compose --profile control-test up -d --wait control-plane-test
          bash ./scripts/ci/control-email-worker-start.sh
      - name: Run browser account recovery flow
        working-directory: apps/frontend
        run: node scripts/e2e-auth-recovery.mjs
      - name: Reset disposable Commercial fixtures before billing flow
        run: |
          docker compose --profile control-test stop control-plane-test
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          docker compose --profile control-test up -d --wait control-plane-test
          bash ./scripts/ci/control-email-worker-start.sh
      - name: Verify real zero-price billing, MFA and cancellation
        working-directory: apps/frontend
        run: npm run test:e2e:billing
      - name: Reset disposable fixtures before paid billing
        run: |
          docker compose --profile control-test stop control-plane-test
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          docker compose --profile control-test up -d --wait control-plane-test
          bash ./scripts/ci/control-email-worker-start.sh
      - name: Verify paid billing through real gateways with synthetic provider wire
        working-directory: apps/frontend
        run: npm run test:e2e:paid-billing
      - name: Reset disposable fixtures before independent operator workflows
        run: |
          docker compose --profile control-test stop control-plane-test
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          docker compose --profile control-test up -d --wait control-plane-test
          bash ./scripts/ci/control-email-worker-start.sh
      - name: Verify two real operators, MFA, finance and privacy evidence
        working-directory: apps/frontend
        env:
          FRONTEND09_AUTH_EVIDENCE: '1'
        run: npm run test:e2e:operators
      - name: Reset isolated fixtures before load without disabling registration limits
        run: |
          docker compose --profile control-test stop control-plane-test
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          docker compose --profile control-test up -d --wait control-plane-test
          bash ./scripts/ci/control-email-worker-start.sh
      - name: Prepare synthetic load catalog in the isolated test database
        run: |
          if docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d postgres -v ON_ERROR_STOP=1 < scripts/ci/seed-load-catalog.sql; then
            echo 'Load fixtures were incorrectly allowed outside the test database.' >&2
            exit 1
          fi
          docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d "$CONTROL_TEST_DB" -v ON_ERROR_STOP=1 < scripts/ci/seed-load-catalog.sql
      - name: Verify lightweight authenticated load thresholds
        working-directory: apps/frontend
        env:
          LOAD_PROFILE: smoke
        run: node scripts/load-commercial.mjs
      - name: Collect browser runtime logs
        if: always()
        run: cp /tmp/vite-e2e.log apps/frontend/vite-e2e.log 2>/dev/null || true
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            apps/frontend/screenshots
            apps/frontend/vite-e2e.log
          if-no-files-found: ignore
      - name: Diagnose failed browser runtime
        if: failure()
        run: |
          docker compose --profile control-test ps -a
          docker compose --profile control-test logs --no-color --tail 200 control-postgres-test control-plane-test mailpit-test
          cat /tmp/vite-e2e.log || true
      - name: Stop isolated browser runtime
        if: always()
        run: |
          if [[ -s /tmp/vite-e2e.pid ]]; then kill "$(cat /tmp/vite-e2e.pid)" 2>/dev/null || true; fi
          rm -f /tmp/vite-e2e.pid /tmp/e2e-cert/key.pem /tmp/e2e-cert/cert.pem
          bash ./scripts/ci/control-test-stop.sh
