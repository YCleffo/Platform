    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD',
              'CONTROL_APP_SECRET', 'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY',
              'E2E_ISOLATION_PROOF', 'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD',
              'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          values['E2E_PASSWORD'] = secrets.token_urlsafe(24)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Map disposable browser host alias
        run: echo "127.0.0.1 e2e.platform.test" | sudo tee -a /etc/hosts
      - name: Build and migrate isolated PHP and PostgreSQL clock runtime
