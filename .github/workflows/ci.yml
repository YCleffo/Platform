name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-configuration:
    name: CI configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate workflow expressions and embedded shell scripts
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11 -color
      - name: Parse CI shell and Node entry points
        run: |
          for script in scripts/ci/*.sh; do bash -n "$script"; done
          node --check scripts/ci/run-verify-suite.mjs
          node --check apps/frontend/scripts/verify-responsive.mjs
          node --check scripts/observability/capacity-baseline.mjs
          node --check scripts/observability/verify-alert-delivery.mjs
          python3 -m py_compile scripts/ci/summarize-image-scan.py
          python3 -m py_compile infra/observability/alert-sink/server.py
      - name: Verify Compose database credential resolution
        run: python3 -m unittest discover -s scripts/database -p 'test_*.py'
      - name: Validate observability manifests
        env:
          METRICS_TOKEN: ci-metrics-token-0123456789abcdef0123456789abcdef
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform_app
          POSTGRES_PASSWORD: ci-postgres-password
          CONTROL_POSTGRES_DB: platform_commercial
          CONTROL_POSTGRES_USER: platform_control
          CONTROL_POSTGRES_PASSWORD: ci-control-password
          CONTROL_APP_SECRET: ci-control-app-secret
          CONTROL_TOKEN_SECRET: ci-control-token-secret
          AUTH_IDENTIFIER_HMAC_KEY: ci-auth-identifier-hmac
          DEVICE_FINGERPRINT_KEY: ci-device-fingerprint
          AUTH_TOTP_ENCRYPTION_KEY: ci-auth-totp-encryption-key
          CONTROL_TOTP_ENCRYPTION_KEY: ci-control-totp-encryption-key
          YOOKASSA_SECRET_KEY: ci-yookassa-secret
          CORE_RUNTIME_PASSWORD: ci-core-runtime-password
          CONTROL_RUNTIME_PASSWORD: ci-control-runtime-password
          CORE_MAINTENANCE_PASSWORD: ci-core-maintenance-password
          CONTROL_MAINTENANCE_PASSWORD: ci-control-maintenance-password
          E2E_ISOLATION_PROOF: ci-isolation-proof
        run: |
          mkdir -p infra/observability/secrets
          printf '%s' "$METRICS_TOKEN" > infra/observability/secrets/metrics-token
          printf '%s' 'http://alert-sink:8080/alerts' > infra/observability/secrets/alert-webhook-url
          docker compose -f compose.yaml -f compose.observability.yaml --profile control config --quiet
          tmp=$(mktemp -d)
          cp -r infra/observability/prometheus/. "$tmp/"
          cp infra/observability/secrets/metrics-token "$tmp/metrics-token"
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /bin/promtool \
            -v "$tmp:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /bin/promtool \
            -v "$tmp/rules:/rules:ro" \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /rules/platform.yml
          mkdir -p "$tmp/alertmanager"
          cp infra/observability/alertmanager/alertmanager.yml "$tmp/alertmanager/alertmanager.yml"
          cp infra/observability/secrets/alert-webhook-url "$tmp/alertmanager/alert-webhook-url"
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /bin/amtool \
            -v "$tmp/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba \
            check-config /etc/alertmanager/alertmanager.yml
          node -e "JSON.parse(require('fs').readFileSync('infra/observability/grafana/dashboards/platform-overview.json','utf8'))"
      - name: Verify pinned Playwright container matches the locked browser package
        run: |
          locked=$(python3 -c "import json; print(json.load(open('apps/frontend/package-lock.json'))['packages']['node_modules/playwright']['version'])")
          image=$(grep -o 'playwright:v[0-9][0-9.]*-noble' scripts/ci/playwright-run.sh | head -n 1 | sed 's/.*playwright:v//; s/-noble//')
          test -n "$locked"
          test "$locked" = "$image" || {
            echo "Playwright package $locked does not match the pinned container image v$image." >&2
            exit 1
          }
          echo "Playwright package and browser container are both $locked."

  windows-tools:
    name: Windows tools
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Verify changed-file archive and ignored-file exclusion
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Git\bin;C:\Program Files\Git\cmd;" + $env:PATH
          if (@(Get-Command git -All -CommandType Application).Count -lt 2) { throw 'Multiple Git paths were not exercised.' }
          ./scripts/ci/test-project-zip.ps1

  windows-agent:
    name: Windows agent
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Build Credential Provider DLL
        run: msbuild apps/agent/Platform.CredentialProvider/Platform.CredentialProvider.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Build all agent components
        run: dotnet build apps/agent/Platform.Agent.sln --configuration Release
      - name: Run agent protocol and recovery tests
        run: dotnet run --project apps/agent/Platform.Agent.Tests --configuration Release --no-build
      - name: Run agent regression and safe IPC tests
        run: dotnet run --project apps/agent/Platform.Agent.RegressionTests --configuration Release --no-build
      - name: Run agent S3 transfer and storage resilience tests
        run: dotnet run --project apps/agent/Platform.Agent.StorageTests --configuration Release --no-build

  backend-fast:
    name: Core В· fast feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    env:
      APP_ENV: test
      POSTGRES_DB: platform_test
      POSTGRES_TEST_DB: platform_test
      POSTGRES_USER: platform_app
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
      DB_NAME: platform_test
      DB_USER: platform_app
      REDIS_HOST: redis-test
      REDIS_PORT: "6380"
      TEST_ISOLATED_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD', 'CONTROL_APP_SECRET',
              'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY',
              'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD', 'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Map isolated service hostnames
        run: echo "127.0.0.1 redis-test" | sudo tee -a /etc/hosts
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, pdo_pgsql, sodium, curl
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock', 'apps/control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Validate, install and audit locked dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          composer audit
      - name: Run Psalm static analysis
        run: ./vendor/bin/psalm --no-cache
      - name: Verify PHP coding style
        run: php ./vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no
      - name: Start isolated database and cache
        working-directory: .
        run: |
          docker compose --profile test up -d --wait postgres-test redis-test
          docker compose --profile test run --rm db-migrate-test
      - name: Build Codeception actors
        run: ./vendor/bin/codecept build
      - name: Run Unit suite with deterministic seed
        run: |
          export DB_PASSWORD="$POSTGRES_PASSWORD"
          ./vendor/bin/codecept run Unit --seed 2120741368
      - name: Stop isolated database and cache
        if: always()
        working-directory: .
        run: bash ./scripts/ci/test-stop.sh

  control-fast:
    name: Commercial В· fast feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, pdo_pgsql, sodium, curl
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock', 'apps/control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Validate, install and audit locked dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          composer audit
      - name: YAML configuration and API contract references
        working-directory: .
        run: php ./scripts/ci/control-config-lint.php
      - name: Static analysis
        env:
          APP_ENV: test
          APP_DEBUG: "0"
          CONTROL_DATABASE_URL: postgresql://unused:unused@control-postgres-test:5432/platform_commercial_test
        run: |
          composer install --no-interaction --prefer-dist --no-scripts --working-dir=../backend
          composer analyse
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies for API coverage
        working-directory: apps/frontend
        run: npm ci
      - name: Verify FRONTEND_07 API coverage inventory
        working-directory: .
        run: node apps/frontend/scripts/frontend07-coverage.mjs --check

  backend-qa:
    name: Core В· quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_DB: platform_test
      POSTGRES_TEST_DB: platform_test
      POSTGRES_USER: platform_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD', 'CONTROL_APP_SECRET',
              'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY',
              'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD', 'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Validate Compose profiles
        run: docker compose --profile control --profile test --profile control-test --profile backup --profile provisioner config --quiet

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, pdo_pgsql, sodium, curl
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock', 'apps/control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate Composer Metadata
        working-directory: apps/backend
        run: |
          composer validate --strict

      - name: Install Composer Dependencies
        working-directory: apps/backend
        run: |
          composer install --no-interaction --prefer-dist

      - name: Verify Composer Platform and Security
        working-directory: apps/backend
        run: |
          composer check-platform-reqs
          composer audit

      - name: Run Psalm Static Analysis
        working-directory: apps/backend
        run: |
          ./vendor/bin/psalm --no-cache

      - name: Verify PHP Coding Style
        working-directory: apps/backend
        run: php ./vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Start Isolated Test Infrastructure
        run: |
          bash ./scripts/ci/test-start.sh

      - name: Verify Core migration and required schema objects
        run: |
          ready=$(docker compose --profile test exec -T postgres-test psql -U "${POSTGRES_USER}" -d "${POSTGRES_TEST_DB}" -tA -c "SELECT to_regclass('core.accounts') IS NOT NULL AND to_regclass('core.privacy_consents') IS NOT NULL AND to_regclass('core.legal_representations') IS NOT NULL AND to_regclass('core.legal_representation_scopes') IS NOT NULL AND to_regclass('core.organizations') IS NOT NULL AND to_regclass('core.organization_memberships') IS NOT NULL AND to_regclass('core.privacy_cleanup_runs') IS NOT NULL AND to_regclass('platform_runtime.installations') IS NOT NULL AND to_regclass('platform_runtime.entitlement_documents') IS NOT NULL;")
          test "$ready" = "t"

      - name: Verify Platform Runtime Objects
        run: |
          ready=$(docker compose --profile test exec -T postgres-test psql -U "${POSTGRES_USER}" -d "${POSTGRES_TEST_DB}" -tA -c "SELECT to_regclass('platform_runtime.installations') IS NOT NULL AND to_regclass('platform_runtime.entitlement_documents') IS NOT NULL;")
          test "$ready" = "t"

      - name: Run Unit Suite on Isolated Runtime with Seed 2120741368
        run: |
          docker compose --profile test exec -T backend-test vendor/bin/codecept run Unit --seed 2120741368

      - name: Run Console Suite on Isolated Runtime with Seed 2120741368
        run: |
          docker compose --profile test exec -T backend-test vendor/bin/codecept run Console --seed 2120741368

      - name: Run Functional Suite on Isolated Runtime with Seed 2120741368
        run: |
          docker compose --profile test exec -T backend-test vendor/bin/codecept run Functional --seed 2120741368

      - name: Run API Suite on Isolated Runtime with Seed 2120741368
        run: |
          docker compose --profile test exec -T backend-test vendor/bin/codecept run Api --seed 2120741368

      - name: Verify stateless Core application restart with durable PostgreSQL
        run: bash ./scripts/ci/core-app-restart-test.sh

      - name: Verify Core runtime role least privilege
        run: bash ./scripts/ci/db-role-gate.sh core

      - name: Build and inspect production Core image
        run: |
          docker build -f apps/backend/docker/Dockerfile --target prod -t platform-core:ci apps/backend
          test "$(docker image inspect platform-core:ci --format '{{.Config.User}}')" = "www-data"
          docker run --rm --entrypoint sh platform-core:ci -c 'test ! -e /app/tests && test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/vendor/bin/phpunit && test ! -d /app/vendor/phpunit && test ! -e /app/c3.php && test -d /app/resources/email && test -d /app/resources/messages && test -w /app/runtime/cache/ro && test -w /app/runtime/logs && test -w /data/caddy && test -w /config/caddy'

      - name: Boot production Core HTTP against the isolated database without checkout mounts
        run: bash ./scripts/ci/production-image-smoke.sh core

      - name: Inventory all high and critical Core image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: platform-core:ci
          scanners: vuln
          format: json
          output: trivy-core.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Summarize and enforce zero fixable high and critical Core image vulnerabilities
        run: python3 scripts/ci/summarize-image-scan.py trivy-core.json --plane Core --fail-on-fixable

      - name: Upload complete Core vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-image-vulnerabilities-${{ github.run_id }}
          path: trivy-core.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnose failed core runtime
        if: failure()
        run: |
          docker compose --profile test ps -a
          docker compose --profile test logs --no-color --tail 100 postgres-test redis-test backend-test

      - name: Stop Test Infrastructure
        if: always()
        run: |
          bash ./scripts/ci/test-stop.sh

  control-plane-qa:
    name: Commercial В· quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Compose resolves both planes; credentials are generated per job.
      POSTGRES_DB: platform_test
      POSTGRES_TEST_DB: platform_test
      POSTGRES_USER: platform_app
      CONTROL_TEST_DB: platform_commercial_test
      CONTROL_TEST_USER: platform_control_test
      PLATFORM_BASE_DOMAIN: platform.example

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD', 'CONTROL_APP_SECRET',
              'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY',
              'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD', 'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Validate Compose profiles
        run: docker compose --profile control --profile test --profile control-test --profile backup --profile provisioner config --quiet

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, pdo_pgsql, sodium, curl
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock', 'apps/control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate and install locked dependencies
        working-directory: apps/control-plane
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          composer audit

      - name: YAML configuration and API contract references
        run: php ./scripts/ci/control-config-lint.php

      - name: Static analysis
        working-directory: apps/control-plane
        env:
          APP_ENV: test
          APP_DEBUG: "0"
          CONTROL_DATABASE_URL: postgresql://unused:unused@control-postgres-test:5432/platform_commercial_test
        run: |
          composer install --no-interaction --prefer-dist --no-scripts --working-dir=../backend
          composer analyse

      - name: Start isolated Commercial test database and migrate from empty
        run: bash ./scripts/ci/control-test-start.sh

      - name: Run unit suite in Linux test image with provisioner secret permissions
        run: docker compose --profile control-test run --rm control-plane-test php vendor/bin/phpunit --testsuite Unit

      - name: Verify clean migration, repeat and required objects
        run: |
          docker compose --profile control-test run --rm control-plane-test php bin/console doctrine:migrations:migrate --no-interaction
          ready=$(docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d "$CONTROL_TEST_DB" -tA -c "SELECT to_regclass('commercial.outbox_events') IS NOT NULL AND to_regclass('commercial.refunds') IS NOT NULL AND to_regclass('commercial.privacy_erasure_cases') IS NOT NULL AND to_regclass('commercial.privacy_holds') IS NOT NULL AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'commercial' AND table_name = 'outbox_events' AND column_name = 'lock_token');")
          test "$ready" = "t"
          versions=$(docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d "$CONTROL_TEST_DB" -tA -c "SELECT count(*) FROM public.doctrine_migration_versions;")
          expected=$(find apps/control-plane/migrations -maxdepth 1 -name 'Version*.php' | wc -l)
          test "$versions" = "$expected"

      - name: Database constraints and integration tests
        run: bash ./scripts/ci/control-test-run.sh

      - name: Verify latest Commercial migration upgrade and rollback cycle
        run: |
          docker compose --profile control-test run --rm control-plane-test php bin/console control:test:reset
          mapfile -t migration_files < <(find apps/control-plane/migrations -maxdepth 1 -name 'Version*.php' -printf '%f\n' | sort)
          test "${#migration_files[@]}" -ge 2
          previous="ControlPlane\\Migrations\\${migration_files[-2]%.php}"
          latest="ControlPlane\\Migrations\\${migration_files[-1]%.php}"
          docker compose --profile control-test run --rm control-plane-test php bin/console doctrine:migrations:migrate "$previous" --no-interaction
          applied=$(docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d "$CONTROL_TEST_DB" -tA -c "SELECT version FROM public.doctrine_migration_versions ORDER BY version DESC LIMIT 1;")
          test "$applied" = "$previous"
          docker compose --profile control-test run --rm control-plane-test php bin/console doctrine:migrations:migrate "$latest" --no-interaction
          docker compose --profile control-test run --rm control-plane-test php bin/console doctrine:migrations:migrate "$previous" --no-interaction
          docker compose --profile control-test run --rm control-plane-test php bin/console doctrine:migrations:migrate "$latest" --no-interaction
          ready=$(docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d "$CONTROL_TEST_DB" -tA -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'commercial' AND table_name = 'outbox_events' AND column_name = 'lock_token');")
          test "$ready" = "t"
          versions=$(docker compose --profile control-test exec -T control-postgres-test psql -U "$CONTROL_TEST_USER" -d "$CONTROL_TEST_DB" -tA -c "SELECT count(*) FROM public.doctrine_migration_versions;")
          expected=$(find apps/control-plane/migrations -maxdepth 1 -name 'Version*.php' | wc -l)
          test "$versions" = "$expected"
          bash ./scripts/ci/control-test-run.sh

      - name: Reset guard and clean rerun
        run: |
          if env APP_ENV=dev bash ./scripts/ci/control-test-reset.sh; then
            echo 'ERROR: Commercial reset was allowed with APP_ENV=dev' >&2
            exit 1
          fi
          env APP_ENV=test bash ./scripts/ci/control-test-reset.sh
          bash ./scripts/ci/control-test-run.sh

      - name: Verify Control Plane readiness with actual workers
        run: bash ./scripts/ci/control-readiness-test.sh

      - name: Verify Commercial runtime role least privilege
        run: bash ./scripts/ci/db-role-gate.sh commercial

      - name: Build and inspect production Control Plane image
        run: |
          docker build -f apps/control-plane/docker/Dockerfile --target app -t platform-control-plane:ci apps/control-plane
          test "$(docker image inspect platform-control-plane:ci --format '{{.Config.User}}')" = "www-data"
          docker run --rm --entrypoint sh platform-control-plane:ci -c 'test ! -e /app/tests && test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/vendor/bin/phpunit && test -w /app/var/cache && test -w /app/var/log'

      - name: Boot production Commercial HTTP against the isolated database without checkout mounts
        run: bash ./scripts/ci/production-image-smoke.sh commercial

      - name: Inventory all high and critical Commercial image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: platform-control-plane:ci
          scanners: vuln
          format: json
          output: trivy-commercial.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Summarize and enforce zero fixable high and critical Commercial image vulnerabilities
        run: python3 scripts/ci/summarize-image-scan.py trivy-commercial.json --plane Commercial --fail-on-fixable

      - name: Upload complete Commercial vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commercial-image-vulnerabilities-${{ github.run_id }}
          path: trivy-commercial.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnose failed commercial runtime
        if: failure()
        run: |
          docker compose --profile control-test ps -a
          docker compose --profile control-test logs --no-color --tail 100 control-postgres-test control-plane-test

      - name: Stop isolated Commercial test runtime
        if: always()
        run: bash ./scripts/ci/control-test-stop.sh

  infrastructure-images:
    name: Image security В· ${{ matrix.plane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: platform-postgres:local
            plane: PostgreSQL
          - image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
            plane: Redis
          - image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
            plane: Mailpit
    steps:
      - uses: actions/checkout@v5
      - name: Build PostgreSQL with the patched privilege-drop helper
        if: matrix.plane == 'PostgreSQL'
        run: docker build -t platform-postgres:local infra/postgres
      - name: Inventory all high and critical infrastructure image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: json
          output: trivy-${{ matrix.plane }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize and enforce zero fixable high and critical infrastructure image vulnerabilities
        run: python3 scripts/ci/summarize-image-scan.py trivy-${{ matrix.plane }}.json --plane ${{ matrix.plane }} --fail-on-fixable
      - name: Upload complete infrastructure vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: infrastructure-image-vulnerabilities-${{ matrix.plane }}-${{ github.run_id }}
          path: trivy-${{ matrix.plane }}.json
          if-no-files-found: ignore
          retention-days: 7

  cross-plane-e2e:
    name: Core в†” Commercial В· E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_DB: platform_test
      POSTGRES_TEST_DB: platform_test
      POSTGRES_USER: platform_app
      CONTROL_TEST_DB: platform_commercial_test
      CONTROL_TEST_USER: platform_control_test
      PLATFORM_BASE_DOMAIN: platform.example
      CROSS_PLANE_REQUIRED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Generate isolated CI secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD', 'CONTROL_APP_SECRET',
              'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY',
              'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD', 'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Validate Compose profiles
        run: docker compose --profile control --profile test --profile control-test --profile backup --profile provisioner config --quiet

      - name: Run required cross-plane integration independently
        run: bash ./scripts/ci/cross-plane-test-run.sh

      - name: Diagnose failed cross-plane runtime
        if: failure()
        run: |
          docker compose --profile test --profile control-test ps -a
          docker compose --profile test --profile control-test logs --no-color --tail 100 postgres-test redis-test control-postgres-test control-plane-test

      - name: Stop isolated cross-plane resources
        if: always()
        run: bash ./scripts/ci/cross-plane-test-stop.sh

  documentation-qa:
    name: Database and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/documentation/package-lock.json
      - name: Verify migration-bound metadata and generated references
        run: |
          python scripts/database/export_schema.py --plane core --from-snapshot --check
          python scripts/database/export_schema.py --plane commercial --from-snapshot --check
          python scripts/database/export_schema.py --plane education --from-snapshot --check
          python scripts/database/export_schema.py --plane device_management --from-snapshot --check
          python scripts/database/export_schema.py --plane storage --from-snapshot --check
          python scripts/documentation/build-reference.py --check
          python scripts/documentation/build-coverage.py --check
          python scripts/documentation/build-education-coverage.py --check
          python scripts/documentation/check-links.py
      - name: Parse DBML and verify physical tables, fields and relations
        run: |
          npm ci --prefix scripts/documentation --ignore-scripts
          npm run check:dbml --prefix scripts/documentation
          npm run check:python --prefix scripts/documentation
          npm audit --audit-level=high --prefix scripts/documentation

  frontend-qa:
    name: Frontend В· quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Verify all dependency, frontend and HTTP contracts
        run: node --test scripts/*.test.mjs
      - name: Verify local SVG sprite
        run: npm run check:icons
      - name: Verify design tokens are generated from the canonical source
        run: npm run check:tokens
      - name: Verify shared style variables and animation timings
        run: npm run check:styles
      - name: Verify Vue formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test
      - name: Verify mutating E2E refuses without an isolated runtime
        run: |
          node scripts/e2e-account-workspace.mjs --check-guard
          node scripts/e2e-invitation-lifecycle.mjs --check-guard
          node scripts/e2e-auth-recovery.mjs --check-guard
          node scripts/e2e-billing-recovery.mjs --check-guard
          node scripts/e2e-paid-billing.mjs --check-guard
          node scripts/e2e-commercial-operators.mjs --check-guard
          node scripts/e2e-core-security.mjs --check-guard
          node scripts/e2e-core-profile.mjs --check-guard
          node scripts/e2e-core-credentials.mjs --check-guard
          node scripts/e2e-core-privacy.mjs --check-guard
          node scripts/e2e-core-privacy-operator.mjs --check-guard
          node scripts/e2e-core-configuration.mjs --check-guard
          node scripts/e2e-education.mjs --check-guard
          node scripts/e2e-education-roles.mjs --check-guard
          node scripts/load-commercial.mjs --check-guard
      - name: Production build
        run: npm run build
      - name: Verify appearance, accessibility, core and commercial UI in parallel
        env:
          BASE_URL: http://127.0.0.1:4174
          VERIFY_CONCURRENCY: "4"
          RESPONSIVE_CONCURRENCY: "3"
          PLAYWRIGHT_DOCKER_NETWORK: bridge
        run: bash ../../scripts/ci/playwright-run.sh bash ../../scripts/ci/verify-browser-suite.sh
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-verification-${{ github.run_id }}
          path: apps/frontend/screenshots
          if-no-files-found: ignore
      - name: Diagnose failed preview
        if: failure()
        run: cat screenshots/vite-verify.log || true

  core-auth-browser:
    name: Core В· account browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: platform-core-browser-ci
      POSTGRES_DB: platform_test
      POSTGRES_TEST_DB: platform_test
      POSTGRES_USER: platform_app
      CONTROL_TEST_DB: platform_commercial_test
      CONTROL_TEST_USER: platform_control_test
      PLATFORM_BASE_DOMAIN: platform.example
      SMTP_HOST: mailpit-core-test
      AUTH_PUBLIC_BASE_URL: https://e2e.platform.test:4175
      AUTH_WEBAUTHN_RP_ID: e2e.platform.test
      AUTH_WEBAUTHN_ORIGINS: https://e2e.platform.test:4175
      CORE_AUTH_BROWSER_OIDC_FIXTURE: "1"
      CORE_PRIVACY_BROWSER_FIXTURE: "1"
      E2E_ALLOWED_HOSTS: e2e.platform.test
      E2E_RUNTIME: isolated-ci
      E2E_ISOLATED_DB: "1"
      E2E_ALLOW_MUTATIONS: "1"
      APP_URL: https://e2e.platform.test:4175
      CORE_API_URL: http://e2e.platform.test:8081
      MAILPIT_URL: http://e2e.platform.test:8027
    steps:
      - uses: actions/checkout@v5
      - name: Generate disposable Core secrets
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {k: secrets.token_hex(32) for k in (
              'YOOKASSA_SECRET_KEY', 'POSTGRES_PASSWORD', 'CONTROL_POSTGRES_PASSWORD', 'CONTROL_TEST_PASSWORD',
              'CONTROL_APP_SECRET', 'CONTROL_TOKEN_SECRET', 'AUTH_IDENTIFIER_HMAC_KEY', 'DEVICE_FINGERPRINT_KEY',
              'CORE_RUNTIME_PASSWORD', 'CONTROL_RUNTIME_PASSWORD', 'CORE_MAINTENANCE_PASSWORD', 'CONTROL_MAINTENANCE_PASSWORD', 'E2E_ISOLATION_PROOF', 'E2E_PASSWORD')}
          values.update({k: base64.b64encode(secrets.token_bytes(32)).decode() for k in (
              'AUTH_TOTP_ENCRYPTION_KEY', 'CONTROL_TOTP_ENCRYPTION_KEY')})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Set up Core Composer dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, pdo_pgsql, sodium, curl
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock', 'apps/control-plane/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install Core dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated Education object storage
        run: |
          python3 scripts/dev/storage02/s3-config.py --test-suite ci --port 18339 \
            --directory runtime/ci-s3 --cors-origin https://e2e.platform.test:4175
          cat runtime/ci-s3/s3.env >> "$GITHUB_ENV"
          compose_file=compose.yaml:compose.ci.yaml:compose.ci.s3.yaml
          compose_env_files=runtime/ci-s3/s3.env
          COMPOSE_FILE="$compose_file" COMPOSE_ENV_FILES="$compose_env_files" docker compose --profile test config --quiet
          printf 'COMPOSE_FILE=%s\nCOMPOSE_ENV_FILES=%s\n' "$compose_file" "$compose_env_files" >> "$GITHUB_ENV"
      - name: Start isolated Core and SMTP runtime
        run: |
          echo '127.0.0.1 e2e.platform.test' | sudo tee -a /etc/hosts
          docker compose --profile test build backend-test
          docker compose --profile test up -d --wait mailpit-core-test
          bash scripts/ci/test-start.sh
          docker compose --profile test exec -d -e CORE_AUTH_BROWSER_SMTP=1 backend-test php yii communication:process-email --loop
          echo "CORE_TEST_CONTAINER=$(docker compose --profile test ps -q backend-test)" >> "$GITHUB_ENV"
          echo "E2E_STORAGE_TEST_CONTAINER=$(docker compose --profile test ps -q seaweedfs-test)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend dependencies and runner Chromium
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start Core frontend
        working-directory: apps/frontend
        env:
          VITE_CORE_PROXY_TARGET: http://127.0.0.1:8081
          VITE_COMMERCIAL_PROXY_TARGET: http://127.0.0.1:1
          VITE_HTTPS_KEY: /tmp/e2e-core-cert/key.pem
          VITE_HTTPS_CERT: /tmp/e2e-core-cert/cert.pem
        run: |
          mkdir -p /tmp/e2e-core-cert
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes -keyout /tmp/e2e-core-cert/key.pem -out /tmp/e2e-core-cert/cert.pem -subj '/CN=e2e.platform.test'
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4175 --strictPort > /tmp/vite-core-auth.log 2>&1 &
          echo $! > /tmp/vite-core-auth.pid
          for _attempt in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          curl -kfsS https://127.0.0.1:4175/ >/dev/null
      - name: Verify Core invitation, password reset, MFA recovery and required password change
        working-directory: apps/frontend
        run: npm run test:e2e:core-auth
      - name: Verify real Core MFA and session management
        working-directory: apps/frontend
        run: npm run test:e2e:core-security
      - name: Verify real Core preferences, settings and consent lifecycle
        working-directory: apps/frontend
        run: npm run test:e2e:core-profile
      - name: Verify real passkey and external credential lifecycle
        working-directory: apps/frontend
        run: npm run test:e2e:core-credentials
      - name: Verify own and representative privacy request lifecycle
        working-directory: apps/frontend
        run: npm run test:e2e:core-privacy
      - name: Verify privacy operator workflow and presence
        working-directory: apps/frontend
        run: npm run test:e2e:core-privacy-operator
      - name: Verify Core configuration forms and public publication
        working-directory: apps/frontend
        env:
          FRONTEND09_AUTH_EVIDENCE: '1'
        run: npm run test:e2e:core-configuration
      - name: Install Education and verify its PostgreSQL workflows
        env:
          EDUCATION_ENABLED: "1"
        run: |
          CI_USER_ID="$(id -u)"
          CI_GROUP_ID="$(id -g)"
          export CI_USER_ID CI_GROUP_ID
          docker compose --profile test exec -T backend-test php yii education:migrate
          docker compose --profile test exec -T backend-test php yii education:migrate
          docker compose --profile test exec -T backend-test php yii device:migrate
          docker compose --profile test exec -T backend-test php yii storage:migrate
          docker compose --profile test up -d --no-build --no-deps --wait backend-test
          docker compose --profile test exec -T backend-test composer yii-config-rebuild
          echo "CORE_TEST_CONTAINER=$(docker compose --profile test ps -q backend-test)" >> "$GITHUB_ENV"
          docker compose --profile test exec -T backend-test vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Education
          docker compose --profile test exec -T backend-test vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Foundation
          docker compose --profile test exec -T postgres-test psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -c 'CREATE DATABASE classroom02_test'
          docker compose --profile test exec -T -e CLASSROOM_TEST_DATABASE=classroom02_test backend-test \
            vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Classroom/ClassroomPostgresRegressionTest.php tests/Unit/DeviceManagement/ClassroomLifecycleRegressionTest.php
          docker compose --profile test exec -T backend-test vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Storage02
          bash scripts/ci/db-role-gate.sh core
      - name: Verify Education through real Core identities, files and browser
        working-directory: apps/frontend
        env:
          FRONTEND09_AUTH_EVIDENCE: '1'
          VITE_EDUCATION_ENABLED: "1"
          VITE_CORE_PROXY_TARGET: http://127.0.0.1:8081
          VITE_COMMERCIAL_PROXY_TARGET: http://127.0.0.1:1
          VITE_HTTPS_KEY: /tmp/e2e-core-cert/key.pem
          VITE_HTTPS_CERT: /tmp/e2e-core-cert/cert.pem
        run: |
          kill "$(cat /tmp/vite-core-auth.pid)"
          npm run build
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4175 --strictPort > /tmp/vite-education.log 2>&1 &
          echo $! > /tmp/vite-core-auth.pid
          for _attempt in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          curl -kfsS https://127.0.0.1:4175/ >/dev/null
          npm run test:e2e:education
          npm run test:e2e:education:student
          npm run test:e2e:education:parent
          npm run test:e2e:education:device
      - name: Verify FRONTEND_07 browser release scenarios and evidence
        working-directory: apps/frontend
        run: |
          manifest=screenshots/education-real/frontend07/manifest.json
          result=0
          node scripts/frontend07-coverage.mjs --run-evidence "$manifest" teacher-enrollment-journal scripts/e2e-education-roles.mjs teacher || result=1
          node scripts/frontend07-coverage.mjs --run-evidence "$manifest" classroom-lifecycle scripts/e2e-education-roles.mjs classroom || result=1
          node scripts/frontend07-coverage.mjs --run-evidence "$manifest" storage-recovery scripts/e2e-education-roles.mjs storage || result=1
          node scripts/frontend07-coverage.mjs --check-evidence "$manifest" || result=1
          exit "$result"
      - name: Upload Core browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-auth-browser-${{ github.run_id }}
          path: |
            apps/frontend/screenshots/education-real
            apps/frontend/screenshots/frontend09-final/authenticated
            apps/frontend/screenshots/core-auth-*
            apps/frontend/screenshots/core-security-*
            apps/frontend/screenshots/core-config-*
            apps/frontend/screenshots/core-profile-*
            apps/frontend/screenshots/core-credentials-*
            apps/frontend/screenshots/core-privacy-*
          if-no-files-found: ignore
      - name: Diagnose Core browser failure
        if: failure()
        run: |
          docker compose --profile test logs --no-color --tail 100 backend-test postgres-test mailpit-core-test seaweedfs-test s3-init-test
          cat /tmp/vite-core-auth.log || true
          cat /tmp/vite-education.log || true
      - name: Remove disposable Core runtime
        if: always()
        run: |
          if [[ -s /tmp/vite-core-auth.pid ]]; then kill "$(cat /tmp/vite-core-auth.pid)" 2>/dev/null || true; fi
          rm -f /tmp/vite-core-auth.pid
          rm -f /tmp/e2e-core-cert/key.pem /tmp/e2e-core-cert/cert.pem
          bash scripts/ci/test-stop.sh

  billing-periodic:
    name: Billing В· renewal and recovery
    runs-on: ubuntu-24.04
