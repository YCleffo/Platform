# Disposable, independent load environment. Never includes development volumes.
name: platform-load
services:
  core-db:
    image: postgres:18
    environment:
      POSTGRES_DB: platform_load_core
      POSTGRES_USER: load_core
      POSTGRES_PASSWORD: disposable-load-core-only
    volumes: [core_data:/var/lib/postgresql]
    networks: [core_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U load_core -d platform_load_core']
      interval: 2s
      timeout: 2s
      retries: 30
  commercial-db:
    image: postgres:18
    environment:
      POSTGRES_DB: platform_load_commercial
      POSTGRES_USER: load_commercial
      POSTGRES_PASSWORD: disposable-load-commercial-only
    volumes: [commercial_data:/var/lib/postgresql]
    networks: [commercial_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U load_commercial -d platform_load_commercial']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [core_net]
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ['127.0.0.1:18025:8025']
    networks: [core_net, commercial_net]
  core-migrate:
    image: postgres:18
    environment:
      POSTGRES_DB: platform_load_core
      POSTGRES_USER: load_core
      POSTGRES_PASSWORD: disposable-load-core-only
      PGHOST: core-db
    entrypoint: [bash, /migrate.sh]
    volumes:
      - ./apps/backend/migrations/sql:/migrations:ro
      - ./infra/postgres/migrate.sh:/migrate.sh:ro
    networks: [core_net]
    depends_on:
      core-db: {condition: service_healthy}
  core:
    image: platform-load-core:local
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: prod
    environment:
      APP_ENV: test
      APP_DEBUG: 'false'
      DB_HOST: core-db
      DB_PORT: '5432'
      DB_NAME: platform_load_core
      DB_USER: load_core
      DB_PASSWORD: disposable-load-core-only
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      AUTH_TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_IDENTIFIER_HMAC_KEY: disposable-load-identifier-key-at-least-32
      DEVICE_FINGERPRINT_KEY: disposable-load-fingerprint-key-at-least-32
    ports: ['127.0.0.1:18081:80']
    networks: [core_net]
    depends_on:
      core-db: {condition: service_healthy}
      redis: {condition: service_started}
  control:
    image: platform-load-control:local
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: app
    environment:
      APP_ENV: test
      APP_DEBUG: '0'
      SERVER_NAME: ':8000'
      SERVER_ROOT: public/
      CONTROL_DATABASE_URL: 'postgresql://load_commercial:disposable-load-commercial-only@commercial-db:5432/platform_load_commercial?serverVersion=18&charset=utf8'
      CONTROL_APP_SECRET: disposable-load-application-secret-at-least-32
      CONTROL_TOKEN_SECRET: disposable-load-token-secret-at-least-32-characters
      CONTROL_TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CONTROL_MAILER_DSN: smtp://mailpit:1025
      # Synthetic fixture decision for local Mailpit only; not a production approval.
      CONTROL_PRIVACY_PROVIDER_DECISIONS: '{"smtp":{"status":"allowed","country":"RU","evidence_reference":"synthetic-local-mailpit-only","purposes":["control_email_verification"],"data_categories":["contact_email","verification_link"]}}'
      CONTROL_MAIL_FROM: no-reply@platform.load
      CONTROL_VERIFICATION_URL: http://localhost:18082/verify-email
      CONTROL_PASSWORD_RESET_URL: http://localhost:18082/reset-password
      CONTROL_MESSAGE_ID_DOMAIN: platform.load
      CONTROL_VERIFICATION_TTL_SECONDS: '86400'
      CONTROL_ACCESS_TOKEN_TTL_SECONDS: '3600'
      CONTROL_SESSION_TTL_SECONDS: '86400'
      CONTROL_PASSWORD_RESET_TTL_SECONDS: '3600'
      CONTROL_MFA_CHALLENGE_TTL_SECONDS: '300'
      CONTROL_TOTP_SETUP_TTL_SECONDS: '600'
      CONTROL_RECENT_AUTH_TTL_SECONDS: '900'
      CONTROL_DEPLOYMENT_CREDENTIAL_TTL_DAYS: '30'
      CONTROL_YOOKASSA_RETURN_URL: https://platform.example/payments/return
      CONTROL_RENEWAL_LEAD_DAYS: '7'
      CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS: '900'
      CONTROL_DUNNING_MAX_ATTEMPTS: '5'
      CONTROL_DUNNING_RETRY_DELAYS_SECONDS: '3600,21600,86400,259200'
      CONTROL_DUNNING_GRACE_SECONDS: '604800'
      CONTROL_DUNNING_UNCERTAIN_RETRY_SECONDS: '300'
      PLATFORM_BASE_DOMAIN: platform.example
    ports: ['127.0.0.1:18082:8000']
    networks: [commercial_net]
    depends_on:
      commercial-db: {condition: service_healthy}
  k6:
    image: grafana/k6:1.0.0
    profiles: [load]
    mem_limit: 12g
    cpus: 4
    environment:
      CORE_URL: http://core
      CONTROL_URL: http://control:8000
      TARGET_VUS: '${TARGET_VUS:-10000}'
      HOLD_SECONDS: '${HOLD_SECONDS:-60}'
      PACE_SECONDS: '${PACE_SECONDS:-5}'
    volumes:
      - ./scripts/load:/scripts:ro
      - ./runtime/load-results:/results
    networks: [core_net, commercial_net]
    command: [run, --quiet, --summary-export=/results/summary.json, /scripts/online.js]
volumes:
  core_data:
  commercial_data:
networks:
  core_net:
  commercial_net:
