name: platform

services:
  # ----------------------------------------------------------------
  # PostgreSQL
  # Main transactional database and source of truth.
  # ----------------------------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}

    ports:
      # Local development access, for example from DBeaver.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # PostgreSQL 18+ stores its versioned PGDATA below this directory.
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    networks:
      - backend_net

  # ----------------------------------------------------------------
  # Redis
  # Cache, locks, queues, presence and short-lived state.
  # It is not a source of truth for business data.
  # ----------------------------------------------------------------
  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - backend_net

  # ----------------------------------------------------------------
  # Mailpit
  # Local SMTP sink and browser UI for development email.
  # ----------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

    networks:
      - backend_net
      - control_net

  # ----------------------------------------------------------------
  # Database migrations
  # One-shot service that applies raw SQL migrations.
  #
  # Applied migrations are recorded in public.platform_migrations.
  # Required objects are checked by name, not a brittle table count.
  # ----------------------------------------------------------------
  db-migrate:
    image: postgres:18
    restart: "no"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PGHOST: postgres
      PGPORT: 5432

    volumes:
      - ./apps/backend/migrations/sql:/migrations:ro
      - ./infra/postgres/migrate.sh:/migrate.sh:ro

    entrypoint:
      - bash
      - /migrate.sh

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend_net

  # ----------------------------------------------------------------
  # Yii3 API backend
  # FrankenPHP + Yii3.
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: dev

    restart: unless-stopped

    environment: &backend_environment
      APP_ENV: ${BACKEND_APP_ENV:-dev}
      APP_DEBUG: ${BACKEND_APP_DEBUG:-true}
      PLATFORM_INSTALLATION_ID: ${PLATFORM_INSTALLATION_ID:-}
      PLATFORM_DEPLOYMENT_MODE: ${PLATFORM_DEPLOYMENT_MODE:-}
      APPLICATION_VERSION: ${APPLICATION_VERSION:-}
      PLATFORM_RELEASE_ID: ${PLATFORM_RELEASE_ID:-}
      PLATFORM_RELEASE_CHANNEL: ${PLATFORM_RELEASE_CHANNEL:-}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      CONTROL_PLANE_DEPLOYMENT_CREDENTIAL_REF: ${CONTROL_PLANE_DEPLOYMENT_CREDENTIAL_REF:-}
      RUNTIME_ENTITLEMENT_TRUSTED_KEYS: '${RUNTIME_ENTITLEMENT_TRUSTED_KEYS:-{}}'
      PRIVACY_CONFIG_FILE: /run/privacy/deployment.json

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@platform.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Platform}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-ru-RU}
      APP_DEFAULT_TIMEZONE: ${APP_DEFAULT_TIMEZONE:-UTC}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DEVICE_FINGERPRINT_KEY: ${DEVICE_FINGERPRINT_KEY:-}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      AUTH_ACTIVATION_TTL_SECONDS: ${AUTH_ACTIVATION_TTL_SECONDS:-86400}
      AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:-1800}
      AUTH_MFA_CHALLENGE_TTL_SECONDS: ${AUTH_MFA_CHALLENGE_TTL_SECONDS:-300}
      AUTH_MFA_RECOVERY_TTL_SECONDS: ${AUTH_MFA_RECOVERY_TTL_SECONDS:-1800}
      AUTH_TOTP_SETUP_TTL_SECONDS: ${AUTH_TOTP_SETUP_TTL_SECONDS:-600}
      AUTH_TOTP_ISSUER: ${AUTH_TOTP_ISSUER:-Platform}
      AUTH_CHALLENGE_RETENTION_DAYS: ${AUTH_CHALLENGE_RETENTION_DAYS:-30}
      AUTH_RECOVERY_CODE_RETENTION_DAYS: ${AUTH_RECOVERY_CODE_RETENTION_DAYS:-30}
      AUTH_CLEANUP_BATCH_SIZE: ${AUTH_CLEANUP_BATCH_SIZE:-500}
      AUTH_RECENT_AUTH_SECONDS: ${AUTH_RECENT_AUTH_SECONDS:-600}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-}
      AUTH_TELEGRAM_CLIENT_ID: ${AUTH_TELEGRAM_CLIENT_ID:-}
      AUTH_TELEGRAM_CLIENT_SECRET: ${AUTH_TELEGRAM_CLIENT_SECRET:-}
      AUTH_TELEGRAM_REDIRECT_URI: ${AUTH_TELEGRAM_REDIRECT_URI:-}
      AUTH_IDENTIFIER_HMAC_KEY: ${AUTH_IDENTIFIER_HMAC_KEY:-}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_RATE_LIMIT_PREFIX: ${REDIS_RATE_LIMIT_PREFIX:-platform:auth}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-30}
      AUTH_LOGIN_IDENTIFIER_LIMIT: ${AUTH_LOGIN_IDENTIFIER_LIMIT:-10}
      AUTH_LOGIN_COMBINED_LIMIT: ${AUTH_LOGIN_COMBINED_LIMIT:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      AUTH_PASSWORD_RESET_LIMIT: ${AUTH_PASSWORD_RESET_LIMIT:-5}
      AUTH_PASSWORD_RESET_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_WINDOW_SECONDS:-3600}
      AUTH_ACTIVATION_RESEND_LIMIT: ${AUTH_ACTIVATION_RESEND_LIMIT:-3}
      AUTH_ACTIVATION_RESEND_WINDOW_SECONDS: ${AUTH_ACTIVATION_RESEND_WINDOW_SECONDS:-3600}
      AUTH_EXTERNAL_START_IP_LIMIT: ${AUTH_EXTERNAL_START_IP_LIMIT:-20}
      AUTH_EXTERNAL_CALLBACK_LIMIT: ${AUTH_EXTERNAL_CALLBACK_LIMIT:-10}
      AUTH_MFA_VERIFY_CHALLENGE_LIMIT: ${AUTH_MFA_VERIFY_CHALLENGE_LIMIT:-5}
      AUTH_MFA_VERIFY_IP_LIMIT: ${AUTH_MFA_VERIFY_IP_LIMIT:-20}
      AUTH_TOTP_SETUP_CONFIRM_LIMIT: ${AUTH_TOTP_SETUP_CONFIRM_LIMIT:-5}
      AUTH_MFA_RECOVERY_IDENTIFIER_LIMIT: ${AUTH_MFA_RECOVERY_IDENTIFIER_LIMIT:-5}
      AUTH_MFA_RECOVERY_IP_LIMIT: ${AUTH_MFA_RECOVERY_IP_LIMIT:-10}
      AUTH_MFA_RECOVERY_CONFIRM_LIMIT: ${AUTH_MFA_RECOVERY_CONFIRM_LIMIT:-5}
      AUTH_MFA_RECOVERY_EXTERNAL_START_IP_LIMIT: ${AUTH_MFA_RECOVERY_EXTERNAL_START_IP_LIMIT:-10}
      AUTH_MFA_RECOVERY_EXTERNAL_TRANSACTION_LIMIT: ${AUTH_MFA_RECOVERY_EXTERNAL_TRANSACTION_LIMIT:-3}
      AUTH_MFA_RECOVERY_EXTERNAL_CALLBACK_LIMIT: ${AUTH_MFA_RECOVERY_EXTERNAL_CALLBACK_LIMIT:-5}
      AUTH_PROVIDER_LINK_LIMIT: ${AUTH_PROVIDER_LINK_LIMIT:-10}
      AUTH_RECOVERY_CODE_LIMIT: ${AUTH_RECOVERY_CODE_LIMIT:-5}
      AUTH_SECURITY_WINDOW_SECONDS: ${AUTH_SECURITY_WINDOW_SECONDS:-900}
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-}
      SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-365}
      PRIVACY_OUTBOX_RETENTION_DAYS: ${PRIVACY_OUTBOX_RETENTION_DAYS:-}
      PRIVACY_INBOX_RETENTION_DAYS: ${PRIVACY_INBOX_RETENTION_DAYS:-}
      PRIVACY_DSAR_RETENTION_DAYS: ${PRIVACY_DSAR_RETENTION_DAYS:-}
      PRIVACY_BLOCK_RETENTION_DAYS: ${PRIVACY_BLOCK_RETENTION_DAYS:-}
      PRIVACY_HOLD_RETENTION_DAYS: ${PRIVACY_HOLD_RETENTION_DAYS:-}
      PRIVACY_DECISION_RETENTION_DAYS: ${PRIVACY_DECISION_RETENTION_DAYS:-}
      PRIVACY_SESSION_RETENTION_DAYS: ${PRIVACY_SESSION_RETENTION_DAYS:-}
      PRIVACY_PRIMARY_DB_COUNTRY: ${PRIVACY_PRIMARY_DB_COUNTRY:-}
      PRIVACY_BACKUP_COUNTRY: ${PRIVACY_BACKUP_COUNTRY:-}
      PRIVACY_OBJECT_STORAGE_COUNTRY: ${PRIVACY_OBJECT_STORAGE_COUNTRY:-}
      PRIVACY_LOG_STORAGE_COUNTRY: ${PRIVACY_LOG_STORAGE_COUNTRY:-}
      PRIVACY_CACHE_COUNTRY: ${PRIVACY_CACHE_COUNTRY:-}
      PRIVACY_RESIDENCY_VERIFIED_AT: ${PRIVACY_RESIDENCY_VERIFIED_AT:-}
      PRIVACY_RESIDENCY_VERIFICATION_REFERENCE: ${PRIVACY_RESIDENCY_VERIFICATION_REFERENCE:-}
      PRIVACY_THREAT_MODEL_REFERENCE: ${PRIVACY_THREAT_MODEL_REFERENCE:-}
      PRIVACY_HARM_ASSESSMENT_REFERENCE: ${PRIVACY_HARM_ASSESSMENT_REFERENCE:-}
      PRIVACY_ISPDN_PROTECTION_LEVEL: ${PRIVACY_ISPDN_PROTECTION_LEVEL:-}
      PRIVACY_RESPONSIBLE_PERSON_REFERENCE: ${PRIVACY_RESPONSIBLE_PERSON_REFERENCE:-}
      PRIVACY_SECURITY_APPROVAL_REFERENCE: ${PRIVACY_SECURITY_APPROVAL_REFERENCE:-}
      MAIL_MESSAGE_ID_DOMAIN: ${MAIL_MESSAGE_ID_DOMAIN:-platform.local}
      MAIL_OUTBOX_LEASE_SECONDS: ${MAIL_OUTBOX_LEASE_SECONDS:-60}
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-5}
      MAIL_OUTBOX_RETRY_BASE_SECONDS: ${MAIL_OUTBOX_RETRY_BASE_SECONDS:-30}
      MAIL_OUTBOX_RETRY_MAX_SECONDS: ${MAIL_OUTBOX_RETRY_MAX_SECONDS:-3600}

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

      db-migrate:
        condition: service_completed_successfully

      mailpit:
        condition: service_started

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"

    volumes:
      - ./apps/backend:/app
      - ./deployment/privacy:/run/privacy:ro

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - backend_net

  backend-email-worker:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["php", "yii", "communication:process-email", "--loop"]
    environment:
      <<: *backend_environment
    volumes:
      - ./apps/backend:/app
      - ./deployment/privacy:/run/privacy:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_net]

  backend-scheduler:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["php", "yii", "scheduler:run"]
    environment:
      <<: *backend_environment
      CORE_SCHEDULER_ENABLED: ${CORE_SCHEDULER_ENABLED:-true}
      CORE_AUTH_CLEANUP_ENABLED: ${CORE_AUTH_CLEANUP_ENABLED:-true}
      CORE_AUTH_CLEANUP_INTERVAL_SECONDS: ${CORE_AUTH_CLEANUP_INTERVAL_SECONDS:-3600}
      CORE_AUTH_CLEANUP_BATCH_LIMIT: ${CORE_AUTH_CLEANUP_BATCH_LIMIT:-500}
      CORE_PRIVACY_RETENTION_ENABLED: ${CORE_PRIVACY_RETENTION_ENABLED:-true}
      CORE_PRIVACY_RETENTION_INTERVAL_SECONDS: ${CORE_PRIVACY_RETENTION_INTERVAL_SECONDS:-3600}
      CORE_PRIVACY_RETENTION_BATCH_LIMIT: ${CORE_PRIVACY_RETENTION_BATCH_LIMIT:-100}
      CORE_PRIVACY_ERASURE_ENABLED: ${CORE_PRIVACY_ERASURE_ENABLED:-false}
      CORE_PRIVACY_ERASURE_INTERVAL_SECONDS: ${CORE_PRIVACY_ERASURE_INTERVAL_SECONDS:-300}
      CORE_PRIVACY_ERASURE_BATCH_LIMIT: ${CORE_PRIVACY_ERASURE_BATCH_LIMIT:-10}
      CORE_PRIVACY_ERASURE_ITEM_LIMIT: ${CORE_PRIVACY_ERASURE_ITEM_LIMIT:-25}
      PRIVACY_AUTOMATION_ACCOUNT_ID: ${PRIVACY_AUTOMATION_ACCOUNT_ID:-}
      CORE_PRIVACY_CLEANUP_ENABLED: ${CORE_PRIVACY_CLEANUP_ENABLED:-false}
      CORE_PRIVACY_CLEANUP_INTERVAL_SECONDS: ${CORE_PRIVACY_CLEANUP_INTERVAL_SECONDS:-3600}
      CORE_PRIVACY_CLEANUP_BATCH_LIMIT: ${CORE_PRIVACY_CLEANUP_BATCH_LIMIT:-100}
      CORE_ENTITLEMENT_SYNC_ENABLED: ${CORE_ENTITLEMENT_SYNC_ENABLED:-true}
      CORE_ENTITLEMENT_SYNC_INTERVAL_SECONDS: ${CORE_ENTITLEMENT_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ./apps/backend:/app
      - ./deployment/privacy:/run/privacy:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_net]

  # ================================================================
  # TEST INFRASTRUCTURE (Completely isolated from development)
  # Activated with: docker compose --profile test up ...
  # ================================================================

  postgres-test:
    profiles: ["test"]
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-platform_test}
      POSTGRES_USER: ${POSTGRES_USER:-platform_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}

    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_app} -d ${POSTGRES_TEST_DB:-platform_test}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

    networks:
      - test_net

  redis-test:
    profiles: ["test"]
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-6380}:6379"

    volumes:
      - redis_test_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

    networks:
      - test_net

  db-migrate-test:
    profiles: ["test"]
    image: postgres:18
    restart: "no"

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-platform_test}
      POSTGRES_USER: ${POSTGRES_USER:-platform_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PGHOST: postgres-test
      PGPORT: 5432

    volumes:
      - ./apps/backend/migrations/sql:/migrations:ro
      - ./infra/postgres/migrate.sh:/migrate.sh:ro

    entrypoint:
      - bash
      - /migrate.sh

    depends_on:
      postgres-test:
        condition: service_healthy

    networks:
      - test_net

  backend-test:
    profiles: ["test"]
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: dev

    restart: unless-stopped

    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      PLATFORM_INSTALLATION_ID: ${PLATFORM_INSTALLATION_ID:-}
      PLATFORM_DEPLOYMENT_MODE: ${PLATFORM_DEPLOYMENT_MODE:-}
      APPLICATION_VERSION: ${APPLICATION_VERSION:-}
      PLATFORM_RELEASE_ID: ${PLATFORM_RELEASE_ID:-}
      PLATFORM_RELEASE_CHANNEL: ${PLATFORM_RELEASE_CHANNEL:-}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      CONTROL_PLANE_DEPLOYMENT_CREDENTIAL_REF: ${CONTROL_PLANE_DEPLOYMENT_CREDENTIAL_REF:-}
      RUNTIME_ENTITLEMENT_TRUSTED_KEYS: '${RUNTIME_ENTITLEMENT_TRUSTED_KEYS:-{}}'
      TEST_ISOLATED_RUNTIME: "1"
      XDEBUG_MODE: "off"

      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_TEST_DB:-platform_test}
      DB_USER: ${POSTGRES_USER:-platform_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@platform.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Platform}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-ru-RU}
      APP_DEFAULT_TIMEZONE: ${APP_DEFAULT_TIMEZONE:-UTC}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DEVICE_FINGERPRINT_KEY: ${DEVICE_FINGERPRINT_KEY:-test-fingerprint-key}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      AUTH_ACTIVATION_TTL_SECONDS: ${AUTH_ACTIVATION_TTL_SECONDS:-86400}
      AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:-1800}
      AUTH_MFA_CHALLENGE_TTL_SECONDS: ${AUTH_MFA_CHALLENGE_TTL_SECONDS:-300}
      AUTH_MFA_RECOVERY_TTL_SECONDS: ${AUTH_MFA_RECOVERY_TTL_SECONDS:-1800}
      AUTH_TOTP_SETUP_TTL_SECONDS: ${AUTH_TOTP_SETUP_TTL_SECONDS:-600}
      AUTH_TOTP_ISSUER: ${AUTH_TOTP_ISSUER:-Platform}
      AUTH_CHALLENGE_RETENTION_DAYS: ${AUTH_CHALLENGE_RETENTION_DAYS:-30}
      AUTH_RECOVERY_CODE_RETENTION_DAYS: ${AUTH_RECOVERY_CODE_RETENTION_DAYS:-30}
      AUTH_CLEANUP_BATCH_SIZE: ${AUTH_CLEANUP_BATCH_SIZE:-500}
      AUTH_RECENT_AUTH_SECONDS: ${AUTH_RECENT_AUTH_SECONDS:-600}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY:-ALasAU4uesJloJ5cggvrzLkmhHFjloie9Azgd4rih3A=}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-google-test-client-id}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-google-test-client-secret}
      AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/callback/google}
      AUTH_TELEGRAM_CLIENT_ID: ${AUTH_TELEGRAM_CLIENT_ID:-telegram-test-client-id}
      AUTH_TELEGRAM_CLIENT_SECRET: ${AUTH_TELEGRAM_CLIENT_SECRET:-telegram-test-client-secret}
      AUTH_TELEGRAM_REDIRECT_URI: ${AUTH_TELEGRAM_REDIRECT_URI:-http://localhost:5173/auth/callback/telegram}
      AUTH_IDENTIFIER_HMAC_KEY: ${AUTH_IDENTIFIER_HMAC_KEY:-0123456789abcdef0123456789abcdef}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:5173}
      REDIS_HOST: redis-test
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_RATE_LIMIT_PREFIX: platform:auth:test
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-30}
      AUTH_LOGIN_IDENTIFIER_LIMIT: ${AUTH_LOGIN_IDENTIFIER_LIMIT:-10}
      AUTH_LOGIN_COMBINED_LIMIT: ${AUTH_LOGIN_COMBINED_LIMIT:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      AUTH_PASSWORD_RESET_LIMIT: ${AUTH_PASSWORD_RESET_LIMIT:-5}
      AUTH_PASSWORD_RESET_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_WINDOW_SECONDS:-3600}
      AUTH_ACTIVATION_RESEND_LIMIT: ${AUTH_ACTIVATION_RESEND_LIMIT:-3}
      AUTH_ACTIVATION_RESEND_WINDOW_SECONDS: ${AUTH_ACTIVATION_RESEND_WINDOW_SECONDS:-3600}
      AUTH_EXTERNAL_START_IP_LIMIT: ${AUTH_EXTERNAL_START_IP_LIMIT:-20}
      AUTH_EXTERNAL_CALLBACK_LIMIT: ${AUTH_EXTERNAL_CALLBACK_LIMIT:-10}
      AUTH_MFA_VERIFY_CHALLENGE_LIMIT: ${AUTH_MFA_VERIFY_CHALLENGE_LIMIT:-5}
      AUTH_MFA_VERIFY_IP_LIMIT: ${AUTH_MFA_VERIFY_IP_LIMIT:-20}
      AUTH_TOTP_SETUP_CONFIRM_LIMIT: ${AUTH_TOTP_SETUP_CONFIRM_LIMIT:-5}
      AUTH_MFA_RECOVERY_IDENTIFIER_LIMIT: ${AUTH_MFA_RECOVERY_IDENTIFIER_LIMIT:-5}
      AUTH_MFA_RECOVERY_IP_LIMIT: ${AUTH_MFA_RECOVERY_IP_LIMIT:-10}
      AUTH_MFA_RECOVERY_CONFIRM_LIMIT: ${AUTH_MFA_RECOVERY_CONFIRM_LIMIT:-5}
      AUTH_MFA_RECOVERY_EXTERNAL_START_IP_LIMIT: ${AUTH_MFA_RECOVERY_EXTERNAL_START_IP_LIMIT:-10}
      AUTH_MFA_RECOVERY_EXTERNAL_TRANSACTION_LIMIT: ${AUTH_MFA_RECOVERY_EXTERNAL_TRANSACTION_LIMIT:-3}
      AUTH_MFA_RECOVERY_EXTERNAL_CALLBACK_LIMIT: ${AUTH_MFA_RECOVERY_EXTERNAL_CALLBACK_LIMIT:-5}
      AUTH_PROVIDER_LINK_LIMIT: ${AUTH_PROVIDER_LINK_LIMIT:-10}
      AUTH_RECOVERY_CODE_LIMIT: ${AUTH_RECOVERY_CODE_LIMIT:-5}
      AUTH_SECURITY_WINDOW_SECONDS: ${AUTH_SECURITY_WINDOW_SECONDS:-900}
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-}
      SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-365}
      MAIL_MESSAGE_ID_DOMAIN: ${MAIL_MESSAGE_ID_DOMAIN:-platform.local}
      MAIL_OUTBOX_LEASE_SECONDS: ${MAIL_OUTBOX_LEASE_SECONDS:-60}
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-5}
      MAIL_OUTBOX_RETRY_BASE_SECONDS: ${MAIL_OUTBOX_RETRY_BASE_SECONDS:-30}
      MAIL_OUTBOX_RETRY_MAX_SECONDS: ${MAIL_OUTBOX_RETRY_MAX_SECONDS:-3600}

    depends_on:
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy

    ports:
      - "127.0.0.1:${BACKEND_TEST_PORT:-8081}:80"

    volumes:
      - ./apps/backend:/app
      - ./contracts:/contracts:ro

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

    networks:
      - test_net

  # The Commercial database and API never join the Diary networks.
  control-postgres:
    profiles: ["control"]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONTROL_POSTGRES_DB:-platform_commercial}
      POSTGRES_USER: ${CONTROL_POSTGRES_USER:-platform_control}
      POSTGRES_PASSWORD: ${CONTROL_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${CONTROL_POSTGRES_PORT:-5434}:5432"
    volumes:
      - control_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTROL_POSTGRES_USER:-platform_control} -d ${CONTROL_POSTGRES_DB:-platform_commercial}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [control_net]

  control-migrate:
    profiles: ["control"]
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: app
    restart: "no"
    environment:
      APP_ENV: ${CONTROL_APP_ENV:-prod}
      CONTROL_APP_SECRET: ${CONTROL_APP_SECRET:-}
      CONTROL_TOKEN_SECRET: ${CONTROL_TOKEN_SECRET:-}
      CONTROL_VERIFICATION_TTL_SECONDS: ${CONTROL_VERIFICATION_TTL_SECONDS:-86400}
      CONTROL_ACCESS_TOKEN_TTL_SECONDS: ${CONTROL_ACCESS_TOKEN_TTL_SECONDS:-900}
      CONTROL_SESSION_TTL_SECONDS: ${CONTROL_SESSION_TTL_SECONDS:-2592000}
      CONTROL_YOOKASSA_RETURN_URL: ${CONTROL_YOOKASSA_RETURN_URL:-}
      CONTROL_RENEWAL_LEAD_DAYS: ${CONTROL_RENEWAL_LEAD_DAYS:-7}
      CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS: ${CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS:-900}
      CONTROL_DATABASE_URL: postgresql://${CONTROL_POSTGRES_USER:-platform_control}:${CONTROL_POSTGRES_PASSWORD:-}@control-postgres:5432/${CONTROL_POSTGRES_DB:-platform_commercial}?serverVersion=18&charset=utf8
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
    depends_on:
      control-postgres:
        condition: service_healthy
    networks: [control_net]

  control-plane:
    profiles: ["control"]
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    environment: &control_environment
      APP_ENV: ${CONTROL_APP_ENV:-prod}
      APP_DEBUG: "0"
      CONTROL_APP_SECRET: ${CONTROL_APP_SECRET:-}
      CONTROL_TOKEN_SECRET: ${CONTROL_TOKEN_SECRET:-}
      CONTROL_PRIVACY_RETENTION_DAYS: '${CONTROL_PRIVACY_RETENTION_DAYS:-{}}'
      CONTROL_PRIVACY_PROCESSING_ROLES: '${CONTROL_PRIVACY_PROCESSING_ROLES:-{}}'
      CONTROL_PRIVACY_RESIDENCY: '${CONTROL_PRIVACY_RESIDENCY:-{}}'
      CONTROL_PRIVACY_PROVIDER_DECISIONS: '${CONTROL_PRIVACY_PROVIDER_DECISIONS:-{}}'
      CONTROL_PRIVACY_SECURITY_REFERENCES: '${CONTROL_PRIVACY_SECURITY_REFERENCES:-{}}'
      CONTROL_PRIVACY_OPERATOR_NOTIFICATION: '${CONTROL_PRIVACY_OPERATOR_NOTIFICATION:-{}}'
      CONTROL_ENTITLEMENT_SECRET_FILES: '${CONTROL_ENTITLEMENT_SECRET_FILES:-{}}'
      CONTROL_PRIVACY_ERASURE_POLICY_APPROVED: ${CONTROL_PRIVACY_ERASURE_POLICY_APPROVED:-false}
      CONTROL_PRIVACY_IDENTITY_RETENTION_DAYS: ${CONTROL_PRIVACY_IDENTITY_RETENTION_DAYS:--1}
      CONTROL_PRIVACY_BILLING_CONTACT_RETENTION_DAYS: ${CONTROL_PRIVACY_BILLING_CONTACT_RETENTION_DAYS:--1}
      CONTROL_MAILER_DSN: ${CONTROL_MAILER_DSN:-smtp://mailpit:1025}
      CONTROL_MAIL_FROM: ${CONTROL_MAIL_FROM:-no-reply@platform.local}
      CONTROL_VERIFICATION_URL: ${CONTROL_VERIFICATION_URL:-http://localhost:5173/verify-email}
      CONTROL_MESSAGE_ID_DOMAIN: ${CONTROL_MESSAGE_ID_DOMAIN:-platform.local}
      CONTROL_VERIFICATION_TTL_SECONDS: ${CONTROL_VERIFICATION_TTL_SECONDS:-86400}
      CONTROL_ACCESS_TOKEN_TTL_SECONDS: ${CONTROL_ACCESS_TOKEN_TTL_SECONDS:-900}
      CONTROL_SESSION_TTL_SECONDS: ${CONTROL_SESSION_TTL_SECONDS:-2592000}
      CONTROL_YOOKASSA_RETURN_URL: ${CONTROL_YOOKASSA_RETURN_URL:-}
      CONTROL_RENEWAL_LEAD_DAYS: ${CONTROL_RENEWAL_LEAD_DAYS:-7}
      CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS: ${CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS:-900}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      CONTROL_DATABASE_URL: postgresql://${CONTROL_POSTGRES_USER:-platform_control}:${CONTROL_POSTGRES_PASSWORD:-}@control-postgres:5432/${CONTROL_POSTGRES_DB:-platform_commercial}?serverVersion=18&charset=utf8
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-platform.example}
    depends_on:
      control-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONTROL_PORT:-8090}:8000"
    volumes:
      - ./deployment/entitlements/signing:/run/entitlement-signing:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control_net]

  control-scheduler:
    profiles: ["control"]
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    command: ["php", "bin/console", "control:scheduler:run"]
    environment:
      <<: *control_environment
      CONTROL_SCHEDULER_ENABLED: ${CONTROL_SCHEDULER_ENABLED:-true}
      CONTROL_RENEWALS_ENABLED: ${CONTROL_RENEWALS_ENABLED:-true}
      CONTROL_RENEWALS_INTERVAL_SECONDS: ${CONTROL_RENEWALS_INTERVAL_SECONDS:-300}
      CONTROL_SUBSCRIPTIONS_ENABLED: ${CONTROL_SUBSCRIPTIONS_ENABLED:-true}
      CONTROL_SUBSCRIPTIONS_INTERVAL_SECONDS: ${CONTROL_SUBSCRIPTIONS_INTERVAL_SECONDS:-300}
      CONTROL_EXPIRATION_ENABLED: ${CONTROL_EXPIRATION_ENABLED:-true}
      CONTROL_EXPIRATION_INTERVAL_SECONDS: ${CONTROL_EXPIRATION_INTERVAL_SECONDS:-300}
      CONTROL_SUBSCRIPTION_BATCH_LIMIT: ${CONTROL_SUBSCRIPTION_BATCH_LIMIT:-100}
      CONTROL_PAYMENT_RECONCILIATION_ENABLED: ${CONTROL_PAYMENT_RECONCILIATION_ENABLED:-true}
      CONTROL_PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${CONTROL_PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-120}
      CONTROL_REFUND_RECONCILIATION_ENABLED: ${CONTROL_REFUND_RECONCILIATION_ENABLED:-true}
      CONTROL_REFUND_RECONCILIATION_INTERVAL_SECONDS: ${CONTROL_REFUND_RECONCILIATION_INTERVAL_SECONDS:-120}
      CONTROL_RECEIPT_RECONCILIATION_ENABLED: ${CONTROL_RECEIPT_RECONCILIATION_ENABLED:-true}
      CONTROL_RECEIPT_RECONCILIATION_INTERVAL_SECONDS: ${CONTROL_RECEIPT_RECONCILIATION_INTERVAL_SECONDS:-120}
      CONTROL_RECONCILIATION_BATCH_LIMIT: ${CONTROL_RECONCILIATION_BATCH_LIMIT:-100}
      CONTROL_PRIVACY_CLEANUP_ENABLED: ${CONTROL_PRIVACY_CLEANUP_ENABLED:-false}
      CONTROL_PRIVACY_CLEANUP_INTERVAL_SECONDS: ${CONTROL_PRIVACY_CLEANUP_INTERVAL_SECONDS:-3600}
      CONTROL_PRIVACY_CLEANUP_BATCH_LIMIT: ${CONTROL_PRIVACY_CLEANUP_BATCH_LIMIT:-100}
    volumes:
      - ./deployment/entitlements/signing:/run/entitlement-signing:ro
    depends_on:
      control-migrate:
        condition: service_completed_successfully
      control-postgres:
        condition: service_healthy
    networks: [control_net]

  control-outbox-worker:
    profiles: ["control"]
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    command: ["php", "bin/console", "control:outbox:process-email", "--loop"]
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${CONTROL_APP_ENV:-prod}
      APP_DEBUG: "0"
      CONTROL_APP_SECRET: ${CONTROL_APP_SECRET:-}
      CONTROL_TOKEN_SECRET: ${CONTROL_TOKEN_SECRET:-}
      CONTROL_PRIVACY_RETENTION_DAYS: '${CONTROL_PRIVACY_RETENTION_DAYS:-{}}'
      CONTROL_PRIVACY_PROCESSING_ROLES: '${CONTROL_PRIVACY_PROCESSING_ROLES:-{}}'
      CONTROL_PRIVACY_RESIDENCY: '${CONTROL_PRIVACY_RESIDENCY:-{}}'
      CONTROL_PRIVACY_PROVIDER_DECISIONS: '${CONTROL_PRIVACY_PROVIDER_DECISIONS:-{}}'
      CONTROL_PRIVACY_SECURITY_REFERENCES: '${CONTROL_PRIVACY_SECURITY_REFERENCES:-{}}'
      CONTROL_PRIVACY_ERASURE_POLICY_APPROVED: ${CONTROL_PRIVACY_ERASURE_POLICY_APPROVED:-false}
      CONTROL_PRIVACY_IDENTITY_RETENTION_DAYS: ${CONTROL_PRIVACY_IDENTITY_RETENTION_DAYS:--1}
      CONTROL_PRIVACY_BILLING_CONTACT_RETENTION_DAYS: ${CONTROL_PRIVACY_BILLING_CONTACT_RETENTION_DAYS:--1}
      CONTROL_MAILER_DSN: ${CONTROL_MAILER_DSN:-smtp://mailpit:1025}
      CONTROL_MAIL_FROM: ${CONTROL_MAIL_FROM:-no-reply@platform.local}
      CONTROL_VERIFICATION_URL: ${CONTROL_VERIFICATION_URL:-http://localhost:5173/verify-email}
      CONTROL_MESSAGE_ID_DOMAIN: ${CONTROL_MESSAGE_ID_DOMAIN:-platform.local}
      CONTROL_VERIFICATION_TTL_SECONDS: ${CONTROL_VERIFICATION_TTL_SECONDS:-86400}
      CONTROL_ACCESS_TOKEN_TTL_SECONDS: ${CONTROL_ACCESS_TOKEN_TTL_SECONDS:-900}
      CONTROL_SESSION_TTL_SECONDS: ${CONTROL_SESSION_TTL_SECONDS:-2592000}
      CONTROL_YOOKASSA_RETURN_URL: ${CONTROL_YOOKASSA_RETURN_URL:-}
      CONTROL_RENEWAL_LEAD_DAYS: ${CONTROL_RENEWAL_LEAD_DAYS:-7}
      CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS: ${CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS:-900}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      CONTROL_DATABASE_URL: postgresql://${CONTROL_POSTGRES_USER:-platform_control}:${CONTROL_POSTGRES_PASSWORD:-}@control-postgres:5432/${CONTROL_POSTGRES_DB:-platform_commercial}?serverVersion=18&charset=utf8
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-platform.example}
    depends_on:
      control-postgres:
        condition: service_healthy
    networks: [control_net]

  control-postgres-test:
    profiles: ["control-test"]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONTROL_TEST_DB:-platform_commercial_test}
      POSTGRES_USER: ${CONTROL_TEST_USER:-platform_control_test}
      POSTGRES_PASSWORD: ${CONTROL_TEST_PASSWORD:-}
    volumes:
      - control_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTROL_TEST_USER:-platform_control_test} -d ${CONTROL_TEST_DB:-platform_commercial_test}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [control_test_net]

  control-plane-test:
    profiles: ["control-test"]
    build:
      context: ./apps/control-plane
      dockerfile: docker/Dockerfile
      target: test
    restart: "no"
    environment:
      APP_ENV: test
      APP_DEBUG: "0"
      CONTROL_TEST_ISOLATED: "1"
      CONTROL_APP_SECRET: test-only-not-a-production-secret
      CONTROL_TOKEN_SECRET: test-only-control-token-secret-at-least-32-chars
      CONTROL_MAILER_DSN: smtp://mailpit:1025
      CONTROL_MAIL_FROM: no-reply@platform.local
      CONTROL_VERIFICATION_URL: http://localhost:5173/verify-email
      CONTROL_MESSAGE_ID_DOMAIN: platform.local
      CONTROL_VERIFICATION_TTL_SECONDS: 86400
      CONTROL_ACCESS_TOKEN_TTL_SECONDS: 900
      CONTROL_SESSION_TTL_SECONDS: 2592000
      CONTROL_YOOKASSA_RETURN_URL: https://platform.example/payments/return
      CONTROL_RENEWAL_LEAD_DAYS: 7
      CONTROL_RENEWAL_SETTLEMENT_GRACE_SECONDS: 900
      YOOKASSA_SECRET_KEY: test-only-yookassa-secret
      CONTROL_DATABASE_URL: postgresql://${CONTROL_TEST_USER:-platform_control_test}:${CONTROL_TEST_PASSWORD:-}@control-postgres-test:5432/${CONTROL_TEST_DB:-platform_commercial_test}?serverVersion=18&charset=utf8
      PLATFORM_BASE_DOMAIN: platform.example
    depends_on:
      control-postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [control_test_net]

volumes:
  postgres_data:
    name: platform_postgres_data

  postgres_test_data:
    name: platform_postgres_test_data

  redis_data:
    name: platform_redis_data

  redis_test_data:
    name: platform_redis_test_data

  control_postgres_data:
    name: platform_control_postgres_data

  control_postgres_test_data:
    name: platform_control_postgres_test_data

networks:
  backend_net:
    name: platform_backend_net
    internal: false

  test_net:
    name: platform_test_net
    internal: false

  control_net:
    name: platform_control_net
    internal: false

  control_test_net:
    name: platform_control_test_net
    internal: false
