name: platform

services:
  # ----------------------------------------------------------------
  # PostgreSQL
  # Main transactional database and source of truth.
  # ----------------------------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}

    ports:
      # Local development access, for example from DBeaver.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # PostgreSQL 18+ stores its versioned PGDATA below this directory.
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    networks:
      - backend_net

  # ----------------------------------------------------------------
  # Redis
  # Cache, locks, queues, presence and short-lived state.
  # It is not a source of truth for business data.
  # ----------------------------------------------------------------
  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - backend_net

  # ----------------------------------------------------------------
  # Database migrations
  # One-shot service that applies raw SQL migrations.
  #
  # Applied migrations are recorded in public.platform_migrations.
  # The Core schema itself remains exactly 23 business tables.
  # ----------------------------------------------------------------
  db-migrate:
    image: postgres:18
    restart: "no"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PGHOST: postgres
      PGPORT: 5432

    volumes:
      - ./apps/backend/migrations/sql:/migrations:ro
      - ./infra/postgres/migrate.sh:/migrate.sh:ro

    entrypoint:
      - bash
      - /migrate.sh

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend_net

  # ----------------------------------------------------------------
  # Yii3 API backend
  # FrankenPHP + Yii3.
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: docker/Dockerfile
      target: dev

    restart: unless-stopped

    environment:
      APP_ENV: dev
      APP_DEBUG: "true"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

      db-migrate:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"

    volumes:
      - ./apps/backend:/app

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - backend_net

volumes:
  postgres_data:
    name: platform_postgres_data

  redis_data:
    name: platform_redis_data

networks:
  backend_net:
    name: platform_backend_net
    internal: false
